    function showVisitorRecordList(records, options) {
      options = options || {};
      const mode = String(options.mode || 'UNIT').toUpperCase();
      const contextLabel = options.contextLabel || (mode === 'PASS' ? 'VISITOR PASS' : 'UNIT');
      const contextValue = options.contextValue || '';
      const ownerDetails = mode === 'UNIT'
        ? (options.ownerDetails || extractOwnerDetails(null, contextValue))
        : null;

      let prepared = Array.isArray(records) ? records.slice() : [];
      if (mode === 'PASS') {
        prepared = prepared
          .map((record, originalIndex) => ({ record, originalIndex }))
          .sort((a, b) => {
            const aOut = isRecordCheckedOut(a.record) ? 1 : 0;
            const bOut = isRecordCheckedOut(b.record) ? 1 : 0;
            return aOut - bOut || a.originalIndex - b.originalIndex;
          })
          .map(item => item.record);
      }

      const limited = prepared.slice(0, 30);
      const hasOwnerReference = !!(
        mode === 'UNIT' &&
        ownerDetails &&
        (ownerDetails.unitFound || ownerDetails.ownerCount > 0)
      );

      if (!limited.length && !hasOwnerReference) return Promise.resolve(null);

      if (!(window.Swal && typeof Swal.fire === 'function')) {
        alert(mode === 'UNIT'
          ? `Unit details found for ${contextValue}.`
          : `${limited.length} visitor record(s) found for ${contextValue}.`);
        return Promise.resolve(null);
      }

      const parkingItems = [];
      const seenParkingSessions = new Set();

      // In UNIT search, prevent older records for the same visitor/vehicle
      // from being reused while another returned record is still active.
      function getUnitRecordIdentityKeys(record) {
        const keys = [];
        const regNorm = normalize(record && (record.regnum || record.registrationNumber || ''));
        const idNorm = normalize(record && (
          record.mykadPassport || record.mykad || record.passport || ''
        ));

        if (regNorm) keys.push(`REG:${regNorm}`);
        if (idNorm) keys.push(`ID:${idNorm}`);
        return keys;
      }

      const activeUnitIdentityKeys = new Set();
      if (mode === 'UNIT') {
        limited.forEach((record) => {
          const parking = getParkingSnapshot(record);
          const parkingActive = !!(
            parking && String(parking.status || '').toUpperCase() === 'ACTIVE'
          );

          if (isRecordCheckedIn(record) || parkingActive) {
            getUnitRecordIdentityKeys(record).forEach((key) => {
              activeUnitIdentityKeys.add(key);
            });
          }
        });
      }

      const cards = limited.map((record, index) => {
        const name = record.namePassport || record.name || '-';
        const reg = record.regnum || record.registrationNumber || '-';
        const contact = record.contact || record.contactNumber || '-';
        const pass = getRecordVisitorPass(record) || '-';
        const unit = getRecordUnitNumber(record) || '-';
        const status = getRecordStatusLabel(record);
        const checkedOut = isRecordCheckedOut(record);
        const checkedIn = isRecordCheckedIn(record);
        const parking = getParkingSnapshot(record);
        const parkingSessionActive = !!(
          mode === 'UNIT' &&
          parking &&
          String(parking.status || '').toUpperCase() === 'ACTIVE'
        );
        const relatedActiveSession = mode === 'UNIT' &&
          !checkedIn &&
          getUnitRecordIdentityKeys(record).some((key) => activeUnitIdentityKeys.has(key));
        const currentSessionActive = parkingSessionActive || relatedActiveSession;
        const disableUse = (mode === 'PASS' && checkedOut) ||
          (mode === 'UNIT' && (checkedIn || currentSessionActive));
        const buttonLabel = mode === 'PASS'
          ? (checkedOut ? 'ALREADY CHECKED OUT' : 'CHECK OUT')
          : checkedIn
            ? 'STILL CHECKED IN'
            : currentSessionActive
              ? 'CURRENT SESSION ACTIVE'
              : 'USE DETAILS';
        const buttonAction = mode === 'PASS' ? 'CHECK_OUT' : 'USE_DETAILS';
        const buttonClass = mode === 'PASS' && !checkedOut
          ? 'unit-record-use unit-record-checkout'
          : 'unit-record-use';

        let parkingHtml = '';
        if (parking) {
          const sessionKey = parking.sessionId || `RECORD-${getCheckOutRecordId(record) || index}`;
          if (!seenParkingSessions.has(sessionKey)) {
            seenParkingSessions.add(sessionKey);
            const parkingKey = `record-${index}`;
            parkingItems.push({ key: parkingKey, snapshot: parking });
            parkingHtml = parkingSummaryHtml(parking, parkingKey, {
              showQr: mode === 'PASS' && checkedIn && !!parking.ePassUrl,
              showPassLink: mode !== 'PASS',
              disableEndedPassLink: mode === 'UNIT',
              recordIndex: index
            });
          }
        }

        return `
          <div class="unit-record-card">
            <div class="unit-record-date">${escapeHtml(getRecordDisplayDate(record))}</div>
            <div class="unit-record-line"><b>NAME:</b> ${escapeHtml(name)}</div>
            <div class="unit-record-line"><b>REG.NUM:</b> ${escapeHtml(reg)}</div>
            <div class="unit-record-line"><b>CONTACT:</b> ${escapeHtml(contact)}</div>
            <div class="unit-record-line"><b>VISITOR PASS:</b> ${escapeHtml(pass)}</div>
            <div class="unit-record-line"><b>UNIT NUMBER:</b> ${escapeHtml(unit)}</div>
            <div class="unit-record-line"><b>STATUS:</b> ${escapeHtml(status)}</div>
            ${parkingHtml}
            <button class="${buttonClass}" type="button" data-record-index="${index}" data-record-action="${buttonAction}" ${disableUse ? 'disabled' : ''}>${buttonLabel}</button>
          </div>`;
      }).join('');

      const unitVisitorHtml = limited.length
        ? `<div class="unit-visitor-heading">LATEST 30 VISITOR RECORDS</div><div class="unit-record-list">${cards}</div>`
        : '<div class="unit-visitor-empty">NO VISITOR RECORD FOUND FOR THIS UNIT.</div>';

      const popupTitle = mode === 'UNIT' ? 'UNIT DETAILS' : 'LATEST 30 VISITOR RECORDS';
      const popupHtml = mode === 'UNIT'
        ? `<div style="font-size:11px;margin-bottom:7px;"><b>UNIT NUMBER:</b> ${escapeHtml(ownerDetails.unitNumber || contextValue)}</div>
           <div class="unit-result-tabs" role="tablist" aria-label="Unit search result">
             <button class="unit-result-tab active" type="button" role="tab" aria-selected="true" data-unit-result-tab="OWNER">OWNER DETAILS</button>
             <button class="unit-result-tab" type="button" role="tab" aria-selected="false" data-unit-result-tab="VISITORS">VISITOR LIST</button>
           </div>
           <div class="unit-result-panel" data-unit-result-panel="OWNER">${ownerDetailsPanelHtml(ownerDetails, contextValue)}</div>
           <div class="unit-result-panel" data-unit-result-panel="VISITORS" hidden>${unitVisitorHtml}</div>`
        : `<div style="font-size:11px;margin-bottom:7px;"><b>${escapeHtml(contextLabel)}:</b> ${escapeHtml(contextValue)}</div><div class="unit-record-list">${cards}</div>`;

      return new Promise((resolve) => {
        let settled = false;
        let stopParkingTimer = function() {};

        Swal.fire({
          title: popupTitle,
          html: popupHtml,
          showConfirmButton: false,
          showCloseButton: true,
          width: 380,
          background: 'linear-gradient(135deg, #e9f7ef 0%, #ffffff 55%, #d8f5e4 100%)',
          color: '#176B39',
          customClass: { popup: 'se-unit-record-popup' },
          didOpen: (popup) => {
            stopParkingTimer = startParkingLiveUpdates(popup, parkingItems);

            if (mode === 'UNIT') {
              const tabs = Array.from(popup.querySelectorAll('[data-unit-result-tab]'));
              const panels = Array.from(popup.querySelectorAll('[data-unit-result-panel]'));

              tabs.forEach((tab) => {
                tab.addEventListener('click', () => {
                  const selectedTab = String(tab.getAttribute('data-unit-result-tab') || 'OWNER');
                  tabs.forEach((item) => {
                    const active = item === tab;
                    item.classList.toggle('active', active);
                    item.setAttribute('aria-selected', active ? 'true' : 'false');
                  });
                  panels.forEach((panel) => {
                    panel.hidden = String(panel.getAttribute('data-unit-result-panel') || '') !== selectedTab;
                  });
                });
              });

              popup.querySelectorAll('[data-owner-proceed]').forEach((button) => {
                button.addEventListener('click', () => {
                  const choice = String(button.getAttribute('data-owner-proceed') || '').toUpperCase();

                  settled = true;
                  Swal.close();

                  if (choice === 'YES') {
                    resolve({
                      action: 'PROCEED_REGISTRATION',
                      unitNumber: String(
                        button.getAttribute('data-owner-unit') ||
                        ownerDetails.unitNumber ||
                        contextValue ||
                        ''
                      ).toUpperCase()
                    });
                  } else {
                    resolve({ action: 'CANCEL_REGISTRATION' });
                  }
                });
              });
            }

            popup.querySelectorAll('[data-show-qr-index]').forEach((button) => {
              button.addEventListener('click', () => {
                const idx = Number(button.getAttribute('data-show-qr-index'));
                const selected = Number.isInteger(idx) ? limited[idx] : null;
                if (!selected) return;
                settled = true;
                Swal.close();
                resolve({ action: 'SHOW_QR', record: selected });
              });
            });

            popup.querySelectorAll('[data-record-index]:not(:disabled)').forEach((button) => {
              button.addEventListener('click', () => {
                const idx = Number(button.getAttribute('data-record-index'));
                const selected = Number.isInteger(idx) ? limited[idx] : null;
                if (!selected) return;
                settled = true;
                const action = String(button.getAttribute('data-record-action') || 'USE_DETAILS');
                Swal.close();
                resolve(mode === 'PASS' ? { action, record: selected } : selected);
              });
            });
          },
          willClose: () => {
            try { stopParkingTimer(); } catch (e) {}
            if (!settled) resolve(null);
          }
        });
      });
    }

    function autofillForm(data, options) {
      options = options || {};

      const nameValue = data && (data.namePassport || data.name);
      const idValue = data && (data.mykadPassport || data.mykad || data.passport);
      const regValue = data && (data.regnum || data.registrationNumber);
      const contactValue = data && (data.contact || data.contactNumber);

      if (nameValue) document.getElementById('namePassport').value = String(nameValue).toUpperCase();

      if (idValue) {
        const icEl = document.getElementById('mykadPassport');
        if (icEl) {
          icEl.value = String(idValue).toUpperCase();
          icEl.dispatchEvent(new Event('input'));
        }
      }

      if (regValue) document.getElementById('regnum').value = String(regValue).toUpperCase();

      if (contactValue) {
        const cEl = document.getElementById('contact');
        if (cEl) cEl.value = String(contactValue).replace(/[^0-9]/g, '');
        try { updateCallLink(); } catch(e) {}
      }

      // Visitor pass is cleared for a new check-in, but preserved for a selected checkout record.
      const passEl = document.getElementById('visitorPassNumber');
      if (passEl) {
        if (options.preservePass) {
          passEl.value = normalizeVisitorPass(options.passNumber || getRecordVisitorPass(data));
        } else {
          passEl.value = '';
        }
      }

      const unitEl = document.getElementById('unitNumber');
      if (unitEl) {
        if (options.preserveUnit) {
          unitEl.value = String(options.unitNumber || getRecordUnitNumber(data) || unitEl.value || '').toUpperCase();
          unitEl.dispatchEvent(new Event('input'));
        } else {
          unitEl.value = '';
        }
      }
    }

    async function handleUnitSearch(originalInput, valueNorm, inputEl) {
      const response = await searchRecord(FIELD.UNIT, valueNorm);
      const records = extractSearchRecords(response);
      const ownerDetails = extractOwnerDetails(response, originalInput);
      const hasOwnerReference = ownerDetails.unitFound || ownerDetails.ownerCount > 0;

      if (!records.length && !hasOwnerReference) {
        window.__SE_LAST_SEARCH_STATUS = 'NO_RECORD';
        window.__SE_EXISTING_PHOTO_LINK = '';

        const result = await safeSwalFire({
          title: 'NO UNIT RECORD FOUND',
          text: 'Please proceed with visitor registration.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'OK',
          cancelButtonText: 'NO',
          background: 'linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 45%, #81d4fa 100%)',
          color: '#176B39',
          width: 380,
          willOpen: popup => { popup.style.borderRadius = '14px'; }
        });

        if (inputEl) inputEl.value = '';

        if (result && result.isConfirmed) {
          const unitEl = document.getElementById('unitNumber');
          if (unitEl) {
            unitEl.value = originalInput.toUpperCase();
            unitEl.dispatchEvent(new Event('input'));
          }

          const formEl = document.getElementById('registrationForm');
          if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          openCamera();
        }
        return;
      }

      const selected = await showVisitorRecordList(records, {
        mode: 'UNIT',
        contextLabel: 'UNIT',
        contextValue: ownerDetails.unitNumber || originalInput.toUpperCase(),
        ownerDetails
      });
      if (inputEl) inputEl.value = '';
      if (!selected) return;

      if (selected.action === 'CANCEL_REGISTRATION') {
        return;
      }

      if (selected.action === 'PROCEED_REGISTRATION') {
        const verifiedUnit = String(
          selected.unitNumber ||
          ownerDetails.unitNumber ||
          originalInput ||
          ''
        ).toUpperCase();

        window.__SE_OWNER_VERIFIED_UNIT = verifiedUnit;

        const unitEl = document.getElementById('unitNumber');
        if (unitEl) {
          unitEl.value = verifiedUnit;
          unitEl.dispatchEvent(new Event('input'));
        }

        // Owner verification is complete. Keep the Unit Number in the form,
        // then return the guard to VEHICLE / PERSON search without opening the keypad.
        await new Promise((resolve) => setTimeout(resolve, 120));
        setSearchMode('PERSON', { preserveVerifiedUnit: true });

        const searchCard = document.querySelector('.search-minicard');
        if (searchCard) {
          searchCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
      }

      const hasPhoto = recordHasPhoto(selected, selected.hasHyperlink);
      setExistingPhotoState(selected, hasPhoto);
      autofillForm(selected, {
        preserveUnit: true,
        unitNumber: ownerDetails.unitNumber || originalInput
      });

      const formEl = document.getElementById('registrationForm');
      if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

      if (!hasPhoto) {
        await safeSwalFire({
          title: 'PREVIOUS RECORD EXPIRED',
          text: 'Visitor details were autofilled. Please retake the ID photo.',
          icon: 'warning',
          confirmButtonText: 'RETAKE',
          background: 'linear-gradient(135deg, #fff9e6 0%, #ffecb3 45%, #ffd54f 100%)',
          color: '#176B39',
          width: 380,
          willOpen: popup => { popup.style.borderRadius = '14px'; }
        });
        openCamera();
      } else {
        safeSwalFire({
          toast: true,
          position: 'top',
          icon: 'success',
          title: 'VISITOR DETAILS AUTOFILLED',
          showConfirmButton: false,
          timer: 2000
        });
      }
    }

    async function handlePassSearch(originalInput, valueNorm, inputEl) {
      clearSelectedCheckOutRecord();

      const response = await searchRecord(FIELD.PASS, valueNorm);
      const records = extractSearchRecords(response);

      if (!records.length) {
        if (inputEl) inputEl.value = '';
        await safeSwalFire({
          title: 'NO PASS RECORD FOUND',
          text: 'No visitor record was found for this Visitor Pass Number.',
          icon: 'warning',
          confirmButtonText: 'OK',
          background: 'linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 45%, #81d4fa 100%)',
          color: '#176B39',
          width: 380,
          willOpen: popup => { popup.style.borderRadius = '14px'; }
        });
        return;
      }

      if (inputEl) inputEl.value = '';

      while (true) {
        const selectedAction = await showVisitorRecordList(records, {
          mode: 'PASS',
          contextLabel: 'VISITOR PASS',
          contextValue: originalInput.toUpperCase()
        });

        if (!selectedAction || !selectedAction.record) return;

        if (selectedAction.action === 'SHOW_QR') {
          await showExistingEPassQrPopup(selectedAction.record);
          continue;
        }

        if (selectedAction.action === 'CHECK_OUT') {
          await handleCheckOut(selectedAction.record);
          return;
        }

        return;
      }
    }

    async function handleUniversalSearch() {
      const btn = document.getElementById('searchButton');
      const inputEl = document.getElementById('searchUniversal');

      const input = (inputEl?.value || '').trim();
      if (!input) return;

      const originalInput = input;
      const valueNorm = normalize(input);
      const requestedMode = String(window.__SE_SEARCH_MODE || 'UNIT').toUpperCase();
      const searchMode = ['UNIT', 'PERSON', 'PASS'].includes(requestedMode) ? requestedMode : 'UNIT';
      const detectedField = searchMode === 'UNIT'
        ? FIELD.UNIT
        : searchMode === 'PASS'
          ? FIELD.PASS
          : detectSearchField(input);

      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span> SEARCHING...';

      try {
        if (searchMode === 'UNIT') {
          await handleUnitSearch(originalInput, valueNorm, inputEl);
          return;
        }

        if (searchMode === 'PASS') {
          await handlePassSearch(originalInput, valueNorm, inputEl);
          return;
        }

        let found = null;
        let hasHyperlink = false;

        // Person / vehicle mode remains a strict single-pass autodetect search.
        const res = await searchRecord(detectedField, valueNorm);

        if (res && res.exist) {
          found = res.data || null;
          hasHyperlink = recordHasPhoto(found, res.hasHyperlink);
        }

        // An active visit must be checked out before the same visitor can register again.
        // This runs before photo-expiry handling because an active record may not yet have a Drive URL.
        if (found && (res.activeCheckIn === true || isRecordCheckedIn(found))) {
          await showActiveVisitorWarning(found);
          if (inputEl) inputEl.value = '';
          return;
        }

        // Verification gate: prevent mismatched records from being treated as FOUND/EXPIRED.
        if (found) {
          const returnedRegNorm = normalize(found.regnum || found.registrationNumber || '');
          const returnedIdNorm = normalize(found.mykadPassport || found.mykad || found.passport || '');

          let isMatch = true;
          if (detectedField === FIELD.REG) {
            isMatch = returnedRegNorm ? (returnedRegNorm === valueNorm) : true;
          } else if (detectedField === FIELD.ID) {
            isMatch = returnedIdNorm ? (returnedIdNorm === valueNorm) : true;
          }

          if (!isMatch) {
            const returnedRaw = detectedField === FIELD.REG
              ? (found.regnum || found.registrationNumber || '')
              : (found.mykadPassport || found.mykad || found.passport || '');

            await safeSwalFire({
              title: 'MISMATCH DETECTED',
              html: `
                <div style="text-align:left; line-height:1.45;">
                  <div><b>YOU SEARCHED:</b> ${escapeHtml(originalInput.toUpperCase())}</div>
                  <div style="margin-top:6px;"><b>RECORD RETURNED:</b> ${escapeHtml(String(returnedRaw || 'UNKNOWN').toUpperCase())}</div>
                  <div style="margin-top:10px;">Please try again.</div>
                </div>`,
              icon: 'warning',
              confirmButtonText: 'TRY AGAIN',
              background: 'linear-gradient(135deg, #fff9e6 0%, #ffecb3 45%, #ffd54f 100%)',
              color: '#176B39',
              width: 380,
              willOpen: popup => { popup.style.borderRadius = '14px'; }
            });

            // Leave the search field unfocused. The user can tap it to edit and retry.
            return;
          }
        }

        if (found && !hasHyperlink) {
          window.__SE_LAST_SEARCH_STATUS = 'EXPIRED';
          window.__SE_EXISTING_PHOTO_LINK = '';

          const result = await safeSwalFire({
            title: 'PREVIOUS RECORD EXPIRED',
            text: 'Please retake the ID photo.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'OK',
            cancelButtonText: 'NO',
            background: 'linear-gradient(135deg, #fff9e6 0%, #ffecb3 45%, #ffd54f 100%)',
            color: '#176B39',
            width: 380,
            willOpen: popup => { popup.style.borderRadius = '14px'; }
          });

          inputEl.value = '';

          if (result && result.isConfirmed) {
            applySearchInputToForm(originalInput, detectedField);
            const formEl = document.getElementById('registrationForm');
            if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            openCamera();
          }
          return;
        }

        if (found) {
          const result = await safeSwalFire({
            title: 'RECORD FOUND',
            text: 'Autofill this form with the existing visitor details?',
            icon: 'success',
            showCancelButton: true,
            confirmButtonText: 'YES',
            cancelButtonText: 'NO',
            background: 'linear-gradient(135deg, #e9f7ef 0%, #c8efd9 45%, #9fdfbf 100%)',
            color: '#176B39',
            width: 380,
            willOpen: popup => { popup.style.borderRadius = '14px'; }
          });

          if (result && result.isConfirmed) {
            setExistingPhotoState(found, true);

            const verifiedUnit = String(window.__SE_OWNER_VERIFIED_UNIT || '').trim().toUpperCase();
            autofillForm(found, verifiedUnit
              ? { preserveUnit: true, unitNumber: verifiedUnit }
              : { preserveUnit: false }
            );

            const formEl = document.getElementById('registrationForm');
            if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            window.__SE_LAST_SEARCH_STATUS = '';
            window.__SE_EXISTING_PHOTO_LINK = '';
          }

          inputEl.value = '';
          return;
        }

        window.__SE_LAST_SEARCH_STATUS = 'NO_RECORD';
        window.__SE_EXISTING_PHOTO_LINK = '';

        const result = await safeSwalFire({
          title: 'NO PREVIOUS RECORD',
          text: 'Please proceed with visitor registration.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'OK',
          cancelButtonText: 'NO',
          background: 'linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 45%, #81d4fa 100%)',
          color: '#176B39',
          width: 380,
          willOpen: popup => { popup.style.borderRadius = '14px'; }
        });

        inputEl.value = '';

        if (result && result.isConfirmed) {
          applySearchInputToForm(originalInput, detectedField);
          const formEl = document.getElementById('registrationForm');
          if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          openCamera();
        }

      } catch (err) {
        console.error(err);

        const isAbort = err?.name === 'AbortError' || /aborted|signal/i.test(err?.message || '');

        safeSwalFire({
          title: 'ERROR',
          text: isAbort
            ? 'Connection timed out or was interrupted. Please try again.'
            : (err?.message || 'Please try again'),
          icon: 'error',
          confirmButtonText: 'OK'
        });
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'SEARCH';
      }
    }

    /* =========================
       CHECK IN / CHECK OUT HELPERS
    ========================= */
    function getOrCreateDeviceId() {
      try {
        const k = 'SE_DEVICE_ID';
        let v = localStorage.getItem(k);
        if (!v) {
          v = (crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : (Date.now().toString(36) + Math.random().toString(36).slice(2));
          localStorage.setItem(k, v);
        }
        return v;
      } catch (e) {
        return '';
      }
    }

    function normalizeVisitorPass(value) {
      return String(value || '')
        .toUpperCase()
        .replace(/[^A-Z0-9-]/g, '')
        .slice(0, 20);
    }

    function updateCheckOutButtonState() {
      const checkOutBtn = document.getElementById('checkOutBtn');
      const checkInBtn = document.getElementById('submitBtn');
      const hasSelected = !!window.__SE_SELECTED_CHECKOUT_RECORD;
      const isCheckingOut = !!window.__SE_isCheckingOut;
      const isCheckingIn = !!__SE_isSubmitting;

      if (checkOutBtn) {
        checkOutBtn.disabled = !hasSelected || isCheckingOut || isCheckingIn;
      }

      // When a record is selected from PASS NUMBER search, the form is in
      // checkout mode. Disable CHECK IN to prevent an accidental new entry.
      if (checkInBtn) {
        checkInBtn.disabled = hasSelected || isCheckingOut || isCheckingIn;
      }
    }

    function clearSelectedCheckOutRecord() {
      window.__SE_SELECTED_CHECKOUT_RECORD = null;
      window.__SE_SELECTED_CHECKOUT_PASS = '';
      try { updateCheckOutButtonState(); } catch (e) {}
    }

    function selectCheckOutRecord(record) {
      window.__SE_SELECTED_CHECKOUT_RECORD = record || null;
      window.__SE_SELECTED_CHECKOUT_PASS = getRecordVisitorPass(record);
      updateCheckOutButtonState();
    }

    function getCheckOutRecordId(record) {
      return record && (
        record.recordId ||
        record.record_id ||
        record.entryId ||
        record.entry_id ||
        record.id ||
        record.rowId ||
        record.row_id ||
        ''
      );
    }


    async function sendCheckOut(record, visitorPassNumber) {
      const data = {
        action: 'CHECK_OUT',
        clientTxnId: (crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : (Date.now().toString(36) + Math.random().toString(36).slice(2)),
        deviceId: getOrCreateDeviceId(),
        recordId: getCheckOutRecordId(record),
        visitorPassNumber: normalizeVisitorPass(visitorPassNumber)
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          cache: 'no-store',
          keepalive: true,
          signal: controller.signal
        });

        if (!res.ok) {
          const msg = await res.text().catch(() => '');
          throw new Error(`Check-out failed (${res.status}): ${msg || res.statusText}`);
        }

        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if (ct.includes('application/json')) return await res.json();

        const raw = await res.text().catch(() => '');
        try { return JSON.parse(raw); } catch (e) { return { success: false, message: raw }; }
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function checkoutRecordHtml(record, visitorPassNumber) {
      const name = record.namePassport || record.name || '-';
      const reg = record.regnum || record.registrationNumber || '-';
      const contact = record.contact || record.contactNumber || '-';
      const unit = getRecordUnitNumber(record) || '-';
      const checkIn = record.checkInTime || record.check_in_time || record.timestamp || record.createdAt || record.created_at || '-';
      const parking = getParkingSnapshot(record);

      return `
        <div style="text-align:left;line-height:1.55;font-size:12px;">
          <div><b>NAME:</b> ${escapeHtml(name)}</div>
          <div><b>REG.NUM:</b> ${escapeHtml(reg)}</div>
          <div><b>CONTACT:</b> ${escapeHtml(contact)}</div>
          <div><b>VISITOR PASS:</b> ${escapeHtml(visitorPassNumber)}</div>
          <div><b>UNIT NUMBER:</b> ${escapeHtml(unit)}</div>
          <div><b>CHECK IN:</b> ${escapeHtml(checkIn)}</div>
          ${parking ? parkingSummaryHtml(parking, 'checkout-confirm') : ''}
        </div>`;
    }

    function resetFormAfterCheckOut() {
      const form = document.getElementById('registrationForm');
      if (form) form.reset();

      const callBtn = document.getElementById('callBtn');
      if (callBtn) {
        callBtn.style.display = 'none';
        callBtn.removeAttribute('href');
      }
      try { updateCallLink(); } catch (e) {}

      if (previewImg) previewImg.src = '#';
      if (imageContainer) imageContainer.style.display = 'none';
      __SE_SUBMIT_PHOTO = '';
      window.__SE_CLIENT_TXN_ID = null;
      window.__SE_LAST_SEARCH_STATUS = '';
      window.__SE_EXISTING_PHOTO_LINK = '';
      window.__SE_OWNER_VERIFIED_UNIT = '';
      if (watermarkOverlay) watermarkOverlay.style.display = '';
      clearSelectedCheckOutRecord();
    }

    async function handleCheckOut(recordOverride) {
      if (__SE_isSubmitting || window.__SE_isCheckingOut) return;

      const record = recordOverride || window.__SE_SELECTED_CHECKOUT_RECORD;
      const visitorPassNumber = normalizeVisitorPass(
        (recordOverride ? getRecordVisitorPass(recordOverride) : window.__SE_SELECTED_CHECKOUT_PASS) ||
        getRecordVisitorPass(record)
      );

      if (!record) {
        await safeSwalFire({
          title: 'SELECT VISITOR RECORD',
          text: 'Please search by Pass Number and select CHECK OUT.',
          icon: 'warning',
          confirmButtonText: 'OK'
        });
        return;
      }

      if (isRecordCheckedOut(record)) {
        clearSelectedCheckOutRecord();
        await safeSwalFire({
          title: 'ALREADY CHECKED OUT',
          text: 'This visitor record has already been checked out.',
          icon: 'warning',
          confirmButtonText: 'OK'
        });
        return;
      }

      const recordId = getCheckOutRecordId(record);
      if (!recordId) {
        await safeSwalFire({
          title: 'RECORD ID NOT AVAILABLE',
          text: 'The selected record cannot be checked out. Please search again.',
          icon: 'error',
          confirmButtonText: 'OK'
        });
        return;
      }

      let confirmed = true;
      let stopCheckoutParking = function() {};
      if (window.Swal && typeof Swal.fire === 'function') {
        const checkoutParking = getParkingSnapshot(record);
        const confirmResult = await Swal.fire({
          title: 'CONFIRM CHECK OUT?',
          html: checkoutRecordHtml(record, visitorPassNumber),
          icon: 'warning',
          showCloseButton: true,
          showCancelButton: false,
          confirmButtonText: 'CONFIRM CHECK OUT',
          customClass: { confirmButton: 'checkout-confirm-btn' },
          background: 'linear-gradient(135deg, #fff5f5 0%, #ffffff 50%, #ffdada 100%)',
          color: '#7f1d1d',
          width: 380,
          didOpen: (popup) => {
            if (checkoutParking) {
              stopCheckoutParking = startParkingLiveUpdates(popup, [
                { key: 'checkout-confirm', snapshot: checkoutParking }
              ]);
            }
          },
          willClose: () => {
            try { stopCheckoutParking(); } catch (e) {}
          }
        });
        confirmed = !!confirmResult.isConfirmed;
      } else {
        confirmed = confirm(`Confirm check out for ${record.namePassport || record.name || visitorPassNumber}?`);
      }

      if (!confirmed) return;

      setCheckOutBtnLoading(true);

      try {
        const result = await sendCheckOut(record, visitorPassNumber);
        if (!result || !result.success) {
          throw new Error((result && result.message) || 'Check-out update was not completed.');
        }

        try {
          if (window.__SE_SEARCH_CACHE && typeof window.__SE_SEARCH_CACHE.clear === 'function') {
            window.__SE_SEARCH_CACHE.clear();
          }
        } catch (e) {}

        resetFormAfterCheckOut();

        await showCheckOutSuccessPopup(result);
      } catch (err) {
        const isAbort = err && (err.name === 'AbortError' || /aborted|signal/i.test(err.message || ''));
        await safeSwalFire({
          title: 'CHECK OUT ERROR',
          text: isAbort
            ? 'Connection timed out or was interrupted. Please try again.'
            : (err.message || 'Please try again.'),
          icon: 'error',
          confirmButtonText: 'OK'
        });
      } finally {
        setCheckOutBtnLoading(false);
      }
    }

    /* =========================
       SUBMIT
    ========================= */
    let __SE_isSubmitting = false;
    window.__SE_isCheckingOut = false;
    let __seActiveToastEl = null;

    function __seIsVisible(el){
      if (!el) return false;
      if (el.disabled) return false;
      if (!el.getClientRects || el.getClientRects().length === 0) return false;
      const cs = window.getComputedStyle ? getComputedStyle(el) : null;
      if (cs && (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0')) return false;
      return true;
    }

    function __seGetLabelText(el){
      const id = el && el.id ? el.id : '';
      if (id) {
        const lbl = document.querySelector(`label[for="${CSS.escape(id)}"]`);
        if (lbl) return (lbl.textContent || '').trim();
      }
      const ph = (el && el.getAttribute) ? (el.getAttribute('placeholder') || '').trim() : '';
      if (ph) return ph.trim();
      const aria = (el && el.getAttribute) ? (el.getAttribute('aria-label') || '').trim() : '';
      if (aria) return aria.trim();
      const raw = (id || (el && el.name) || '').toString();
      if (raw) {
        return raw
          .replace(/[_-]+/g, ' ')
          .replace(/([a-z])([A-Z])/g, '$1 $2')
          .replace(/\s+/g, ' ')
          .trim()
          .toUpperCase();
      }
      return 'FIELD';
    }

    function __seFirstInvalid(formEl){
      if (!formEl) return null;
      const els = formEl.querySelectorAll('input, select, textarea');
      for (const el of els) {
        if (!__seIsVisible(el)) continue;
        try { if (el.id === 'mykadPassport') validateMykadPassport(); } catch (e) {}
        try { if (el.id === 'contact') updateCallLink(); } catch (e) {}
        if (el.willValidate && el.validity && el.validity.valid === false) return el;
      }
      return null;
    }

    function __seToastGeom(el){
      try {
        const r = el.getBoundingClientRect();
        const viewportW = window.innerWidth || document.documentElement.clientWidth || 360;
        const centerX = r.left + (r.width / 2);
        const maxW = Math.min(viewportW - 16, 560);
        const width = Math.max(260, Math.min(maxW, r.width));
        const half = width / 2;
        const clampedCenterX = Math.max(8 + half, Math.min(viewportW - 8 - half, centerX));
        return { centerX: clampedCenterX, width };
      } catch (e) {
        const vw = (window.innerWidth||360);
        const w = Math.min(vw-16, 360);
        return { centerX: vw/2, width: w };
      }
    }

    function __seShowInvalidToast(el){
      const label = __seGetLabelText(el);
      const msgRaw = (el && el.validationMessage) ? el.validationMessage : '';
      const msg = msgRaw || 'Required';
      const title = `${label}: ${msg}`;

      const formEl = document.getElementById('registrationForm');
      if (formEl) formEl.querySelectorAll('.se-invalid-blink').forEach(x => x.classList.remove('se-invalid-blink'));
      try { el.classList.add('se-invalid-blink'); } catch (e) {}
      try { el.focus({ preventScroll: false }); } catch (e) { try { el.focus(); } catch (e2) {} }
      try { el.scrollIntoView({ behavior: 'auto', block: 'center' }); } catch (e) {}

      if (window.Swal && typeof Swal.fire === 'function') {
        try { Swal.close(); } catch (e) {}
        const g = __seToastGeom(el);
        setTimeout(() => {
          const g = __seToastGeom(el);
          try { Swal.close(); } catch (e) {}
          Swal.fire({
            toast: true,
            position: 'top',
            icon: 'warning',
            title: title,
            showConfirmButton: false,
            didOpen: (toast) => {
              try {
                __seActiveToastEl = el;
                const c = Swal.getContainer();
                try { if (c) c.classList.add('se-toast-near'); } catch (e) {}
                const tr = el.getBoundingClientRect();
                const toastH = (toast && toast.getBoundingClientRect) ? toast.getBoundingClientRect().height : 70;
                const header = document.querySelector('.fixed-header');
                const safeTop = (header ? header.offsetHeight : 0) + 6;
                let top = tr.top - toastH - 10;
                if (top < safeTop) top = tr.bottom + 10;
                const vh = window.innerHeight || document.documentElement.clientHeight || 640;
                if (top > vh - toastH - 6) top = Math.max(safeTop, vh - toastH - 6);

                if (c && g) {
                  c.style.position = 'fixed';
                  c.style.top = top + 'px';
                  c.style.left = g.centerX + 'px';
                  c.style.transform = 'translateX(-50%)';
                  c.style.right = 'auto';
                  c.style.bottom = 'auto';
                  c.style.width = g.width + 'px';
                  c.style.padding = '0';
                  c.style.margin = '0';
                  c.style.pointerEvents = 'none';
                }
                if (toast) {
                  toast.style.width = '100%';
                  toast.style.margin = '0';
                  toast.style.pointerEvents = 'auto';
                }
              } catch (e) {}
              try { toast.addEventListener('click', () => Swal.close()); } catch (e) {}
            }
          });
        }, 60);
      } else {
        alert(title);
      }
    }

    function __seCloseToastOnEdit(target){
      try {
        if (target && target.classList && target.classList.contains('se-invalid-blink')) {
          target.classList.remove('se-invalid-blink');
        }
      } catch (e) {}
      try {
        if (__seActiveToastEl && target === __seActiveToastEl && window.Swal) {
          Swal.close();
          __seActiveToastEl = null;
        }
      } catch (e) {}
    }

    document.addEventListener('input', (ev) => __seCloseToastOnEdit(ev && ev.target), true);
    document.addEventListener('change', (ev) => __seCloseToastOnEdit(ev && ev.target), true);

    function __seEnsureNoValidate(){
      const f = document.getElementById('registrationForm');
      if (!f) return;
      try { f.noValidate = true; } catch (e) {}
      try { f.setAttribute('novalidate','novalidate'); } catch (e) {}
    }
    __seEnsureNoValidate();

    document.getElementById("registrationForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      if (window.__SE_SELECTED_CHECKOUT_RECORD) {
        await safeSwalFire({
          title: 'CHECK OUT MODE ACTIVE',
          text: 'Please complete or cancel the selected check-out record before making a new check-in.',
          icon: 'warning',
          confirmButtonText: 'OK'
        });
        return;
      }

      try { validateMykadPassport(); } catch (e) {}
      try { updateCallLink(); } catch (e) {}

      const firstBad = __seFirstInvalid(this);
      if (firstBad) {
        __seShowInvalidToast(firstBad);
        return;
      }

      if (__SE_isSubmitting) return;
      __SE_isSubmitting = true;

      setSubmitBtnLoading(true);

      const deviceId = getOrCreateDeviceId();

      if (!window.__SE_CLIENT_TXN_ID) {
        window.__SE_CLIENT_TXN_ID = (crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
      }
      const clientTxnId = window.__SE_CLIENT_TXN_ID;

      const croppedImage = getVisibleCroppedImageData();

      const visitorPassNumberVal = document.getElementById('visitorPassNumber').value.trim().toUpperCase();
      const unitNumberVal = document.getElementById('unitNumber').value.trim().toUpperCase();

      const existingPhotoLink = (window.__SE_EXISTING_PHOTO_LINK || '').toString().trim();

      if (!croppedImage && !existingPhotoLink) {
        safeSwalFire({
          title: 'ID PHOTO REQUIRED',
          text: 'Please take an ID photo before submitting.',
          icon: 'warning',
          confirmButtonText: 'OK'
        });
        __SE_isSubmitting = false;
        setSubmitBtnLoading(false);
        return;
      }
      const data = {
        action: 'CHECK_IN',
        clientTxnId,
        deviceId,
        namePassport: document.getElementById('namePassport').value,
        mykadPassport: document.getElementById('mykadPassport').value,
        regnum: document.getElementById('regnum').value,
        contact: document.getElementById('contact').value,
        visitorPassNumber: visitorPassNumberVal,
        unitNumber: unitNumberVal,
        imageUrl: croppedImage || ''
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
          cache: "no-store",
          keepalive: !(data && data.imageUrl),
          signal: controller.signal
        });

        if (!res.ok) {
          const errText = await res.text().catch(() => "");
          throw new Error(`HTTP ${res.status} ${res.statusText}${errText ? " - " + errText.slice(0, 200) : ""}`);
        }

        const ct = (res.headers.get("content-type") || "").toLowerCase();
        let respData;
        if (ct.includes("application/json")) {
          respData = await res.json();
        } else {
          const t = await res.text().catch(() => "");
          try { respData = JSON.parse(t); } catch { respData = { success: false, message: t }; }
        }

        if (respData && respData.success) {
          await showCheckInSuccessPopup(respData, data);

          document.getElementById("registrationForm").reset();

          (function hideCallBtnAfterReset(){
            const callBtn = document.getElementById('callBtn');
            if (callBtn) {
              callBtn.style.display = 'none';
              callBtn.removeAttribute('href');
            }
            try { updateCallLink(); } catch(e) {}
          })();

          if (previewImg) previewImg.src = "#";
          if (imageContainer) imageContainer.style.display = 'none';
          __SE_SUBMIT_PHOTO = "";
          window.__SE_CLIENT_TXN_ID = null;
          window.__SE_LAST_SEARCH_STATUS = '';
          window.__SE_EXISTING_PHOTO_LINK = '';
          window.__SE_OWNER_VERIFIED_UNIT = '';
          clearSelectedCheckOutRecord();
          try {
            if (window.__SE_SEARCH_CACHE && typeof window.__SE_SEARCH_CACHE.clear === 'function') {
              window.__SE_SEARCH_CACHE.clear();
            }
          } catch (e) {}

          if (watermarkOverlay) watermarkOverlay.style.display = '';

        } else {
          if (respData && respData.code === 'VISITOR_ALREADY_CHECKED_IN') {
            await showActiveVisitorWarning(
              respData.activeRecord || null,
              respData.message || 'This visitor already has an active check-in record.'
            );
          } else {
            await safeSwalFire({
              title: 'ERROR!',
              text: 'Submit failed: ' + (respData.message || ''),
              icon: 'error',
              confirmButtonText: 'OK'
            });
          }
        }
      } catch (err) {
        safeSwalFire({
          title: 'ERROR!',
          text: 'Error submitting data: ' + err.message,
          icon: 'error',
          confirmButtonText: 'OK'
        });
      } finally {
        clearTimeout(timeoutId);
        __SE_isSubmitting = false;
        setSubmitBtnLoading(false);
      }
    });

    /* =========================
       MOBILE KEYBOARD / FORM LIFT
       - Keeps the active search or registration field above the soft keyboard.
       - Respects the fixed header and does not affect popups or camera UI.
    ========================= */
    (function bindKeyboardAwareFormLift() {
      const visualViewport = window.visualViewport;
      if (!visualViewport) return;

      let activeField = null;
      let rafId = null;
      let settleTimer = null;
      let baselineViewportHeight = Math.max(
        window.innerHeight || 0,
        visualViewport.height || 0
      );

      function isSupportedField(el) {
        if (!el || !el.matches) return false;
        return el.matches(
          '#searchUniversal, #registrationForm input:not([type="file"]), #registrationForm select, #registrationForm textarea'
        );
      }

      function getFixedHeaderBottom() {
        const header = document.querySelector('.fixed-header');
        return header ? Math.ceil(header.getBoundingClientRect().bottom) + 10 : 10;
      }

      function getKeyboardHeight() {
        return Math.max(
          0,
          baselineViewportHeight - visualViewport.height - visualViewport.offsetTop
        );
      }

      function scheduleLift(delay) {
        if (settleTimer) clearTimeout(settleTimer);
        settleTimer = setTimeout(() => {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(liftActiveField);
        }, Math.max(0, delay || 0));
      }

      function liftActiveField() {
        rafId = null;
        const field = activeField;
        if (!isSupportedField(field) || document.activeElement !== field) return;

        // Ignore normal viewport changes. Act only when a soft keyboard is likely open.
        const keyboardHeight = getKeyboardHeight();
        const keyboardOpen = keyboardHeight > 120;
        if (!keyboardOpen) return;

        const safeTop = getFixedHeaderBottom();
        const safeBottom = visualViewport.offsetTop + visualViewport.height - 16;
        const container = field.closest('.search-minicard, #registrationForm');

        // The search card is short enough to move as one complete card.
        if (container && container.classList.contains('search-minicard')) {
          const cardRect = container.getBoundingClientRect();
          const availableHeight = Math.max(0, safeBottom - safeTop);

          if (cardRect.height <= availableHeight) {
            const cardDelta = cardRect.top - safeTop;
            if (Math.abs(cardDelta) > 4) {
              window.scrollBy({ top: cardDelta, left: 0, behavior: 'smooth' });
              return;
            }
          }
        }

        // Registration form may be taller than the remaining screen, so keep
        // the active field (and its label) visible instead of forcing the whole form.
        const fieldRect = field.getBoundingClientRect();
        const label = field.id
          ? document.querySelector(`label[for="${CSS.escape(field.id)}"]`)
          : null;
        const labelTop = label ? label.getBoundingClientRect().top : fieldRect.top;
        const fieldTop = Math.min(labelTop, fieldRect.top);
        const desiredBottom = safeBottom - 18;

        let delta = 0;
        if (fieldRect.bottom > desiredBottom) {
          delta = fieldRect.bottom - desiredBottom;
        } else if (fieldTop < safeTop) {
          delta = fieldTop - safeTop;
        }

        if (Math.abs(delta) > 4) {
          window.scrollBy({ top: delta, left: 0, behavior: 'smooth' });
        }
      }

      document.addEventListener('focusin', (event) => {
        const target = event && event.target;
        if (!isSupportedField(target)) return;

        activeField = target;
        baselineViewportHeight = Math.max(
          baselineViewportHeight,
          window.innerHeight || 0,
          visualViewport.height || 0
        );
        // Android keyboards resize in stages. Recheck after each stage settles.
        scheduleLift(80);
        setTimeout(() => scheduleLift(0), 220);
        setTimeout(() => scheduleLift(0), 420);
      }, true);

      document.addEventListener('focusout', () => {
        setTimeout(() => {
          if (!isSupportedField(document.activeElement)) {
            activeField = null;
            baselineViewportHeight = Math.max(
              baselineViewportHeight,
              window.innerHeight || 0,
              visualViewport.height || 0
            );
          }
        }, 80);
      }, true);

      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          baselineViewportHeight = Math.max(
            window.innerHeight || 0,
            visualViewport.height || 0
          );
        }, 350);
      });

      visualViewport.addEventListener('resize', () => scheduleLift(20));
      visualViewport.addEventListener('scroll', () => scheduleLift(20));
    })();

    /* =========================
       UI - FIXED HEADER OFFSET & DATE TIME
    ========================= */
    function pad(n) {
      return n < 10 ? '0' + n : String(n);
    }

    function updateDateTime() {
      const now = new Date();
      const d = pad(now.getDate());
      const m = pad(now.getMonth() + 1);
      const y = now.getFullYear();
      const h = pad(now.getHours());
      const min = pad(now.getMinutes());
      const s = pad(now.getSeconds());
      const elDate = document.getElementById('liveDateOnly');
      const elTime = document.getElementById('liveTimeOnly');

      if (elDate) elDate.textContent = `${d}/${m}/${y}`;
      if (elTime) elTime.textContent = `${h}:${min}:${s}`;
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();

    function syncHeaderOffset() {
      const header = document.querySelector('.fixed-header');
      if (!header) return;
      const height = header.offsetHeight;
      document.body.style.paddingTop = height + 'px';
    }
    window.addEventListener('load', syncHeaderOffset);
    window.addEventListener('resize', syncHeaderOffset);
    syncHeaderOffset();
  </script>
</body>
</html>
