    .spinner, .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-sizing: border-box;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-right-color: #ffffff;
      border-bottom-color: rgba(255, 255, 255, 0.1);
      border-left-color: rgba(255, 255, 255, 0.1);
      animation: google-spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes google-spin {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
      100% { transform: rotate(360deg); }
    }

    .ocr-panel {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 60;
      pointer-events: none;
      user-select: none;
    }

    .ocr-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .ocr-item .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .ocr-item.bad { color: #ff3b3b; }
    .ocr-item.bad .dot { background: #ff3b3b; box-shadow: 0 0 12px rgba(255, 59, 59, .65); }
    .ocr-item.good { color: #16c172; }
    .ocr-item.good .dot { background: #16c172; box-shadow: 0 0 12px rgba(22, 193, 114, .85); }

    .guideline.ocr-ready {
      animation: ocrGoogleBorder 1.4s linear infinite, ocrGlow 0.8s ease-in-out infinite alternate;
    }

    @keyframes ocrGoogleBorder {
      0% { border-color: #34A853; }
      25% { border-color: #FBBC05; }
      50% { border-color: #4285F4; }
      75% { border-color: #EA4335; }
      100% { border-color: #34A853; }
    }

    @keyframes ocrGlow {
      0% { box-shadow: 0 0 0 rgba(0, 0, 0, 0); }
      100% { box-shadow: 0 0 26px rgba(255, 255, 255, .35); }
    }

    .ocr-title {

    /* ==================================================
       PREMIUM UI PATCH
       - Fixed header premium (Sensory style)
       - Soft green glow cards/inputs
       - Consistent 3D/gradient buttons
       - Lightweight micro-animations (loading ring + success pop)
    ================================================== */
    :root {
      --se-green-1: #41e671;
      --se-green-2: #176B39;
      --se-green-3: #3bd97b;
      --se-text: #176B39;
      --se-placeholder: #a7b2ad;
      --se-card: #ffffff;
      --se-glow: rgba(59, 217, 123, .18);
      --se-glow-strong: rgba(59, 217, 123, .28);
    }

    /* GLOBAL FONT OVERRIDE (Google Sans) */
    html, body, button, input, select, textarea, label, h1, h2, h3, h4, h5, h6,
    .clock-bar, .header-gradient, .search-mini-title, .photo-label, .swal2-popup, .swal2-title, .swal2-html-container, .swal2-confirm, .swal2-cancel, .footer {
      font-family: 'Google Sans', 'Google Sans Text', Roboto, Arial, sans-serif !important;
    }

    /* Respect reduce-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Header: premium fixed + glass */
    .fixed-header {
      background: rgba(233, 245, 233, .86) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(23, 107, 57, .12);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .08) !important;
    }

    .fixed-header::after {
      content: "";
      display: block;
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(65, 230, 113, .65) 20%, rgba(23, 107, 57, .75) 60%, transparent 100%);
      opacity: .55;
    }

    /* Cards: soft glow */
    .search-minicard {
      border: 1px solid rgba(23, 107, 57, .10);
      box-shadow: 0 10px 22px rgba(23, 107, 57, .08), 0 0 18px var(--se-glow) !important;
    }

    #registrationForm {
      max-width: 330px;
      margin: 0 auto 18px auto;
      background: var(--se-card);
      border-radius: 13px;
      border: 1px solid rgba(23, 107, 57, .10);
      box-shadow: 0 10px 22px rgba(23, 107, 57, .08), 0 0 18px var(--se-glow);
      padding: 12px 15px 16px 15px;
    }

    /* Inputs: glow focus + consistent placeholder */
    input::placeholder {
      color: var(--se-placeholder) !important;
      opacity: .92;
    }

    .search-mini-input::placeholder {
      color: var(--se-placeholder) !important;
      opacity: .92;
    }

    select:invalid, input:focus, select:focus, .search-mini-input:focus {
      box-shadow: 0 0 0 3px rgba(59, 217, 123, .18);
    }

    /* Required/invalid: red blink on submit (overrides green focus glow) */
    .se-invalid-blink, .se-invalid-blink:focus, .se-invalid-blink:focus-visible, .se-invalid-blink:invalid {
      border-color: rgba(231, 76, 60, .95) !important;
      box-shadow: 0 0 0 2px rgba(231, 76, 60, .25), 0 0 0 5px rgba(231, 76, 60, .12) !important;
      animation: seInvalidBlink 1s ease-in-out infinite;
    }

    @keyframes seInvalidBlink {
      0%, 100% {
        box-shadow: 0 0 0 2px rgba(231, 76, 60, .22), 0 0 0 5px rgba(231, 76, 60, .10);
      }
      50% {
        box-shadow: 0 0 0 3px rgba(231, 76, 60, .35), 0 0 0 7px rgba(231, 76, 60, .16);
      }
    }

    /* Buttons: consistent premium gradient + micro-lift */
    .btn-3d, .swal2-confirm {
      background: linear-gradient(145deg, var(--se-green-1) 0%, var(--se-green-2) 100%) !important;
    }

    .btn-3d:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(23, 107, 57, .18), 0 0 18px var(--se-glow-strong);
    }

    .btn-3d:active {
      transform: translateY(2px) scale(.99);
    }

    .btn-3d:disabled {
      opacity: .75;
      transform: none !important;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .10) !important;
    }

    /* Keep round buttons consistent too */
    .call-btn-3d, .capture-btn-3d {
      background: linear-gradient(145deg, var(--se-green-1) 0%, var(--se-green-2) 100%) !important;
    }

    /* SweetAlert success micro-pop */
    @keyframes seSuccessPop {
      0% { transform: scale(.92); }
      100% { transform: scale(1); }
    }

    .swal2-icon.swal2-success {
      animation: seSuccessPop .18s ease-out;
    }

    /* SweetAlert2 toast helper (Option A) */
    .swal2-container { z-index: 99999 !important; }
    .swal2-popup.swal2-toast { box-shadow: 0 8px 20px rgba(0, 0, 0, .18); }
    /* Toast typography (slightly smaller + cleaner) */
    .swal2-popup.swal2-toast { padding: 10px 12px !important; }
    .swal2-popup.swal2-toast .swal2-title { font-size: 14px !important; letter-spacing: 0.8px !important; line-height: 1.15 !important; }
    .swal2-popup.swal2-toast .swal2-html-container { font-size: 12px !important; letter-spacing: 0.45px !important; line-height: 1.25 !important; }
    .swal2-popup.swal2-toast .swal2-icon { width: 1.6em !important; height: 1.6em !important; margin: 0 .55em 0 0 !important; }
    .swal2-popup.swal2-toast .swal2-icon-content { font-size: 1.15em !important; }
    /* Secure Entry: center toast content (icon + text) */
    .swal2-container.se-toast-near { pointer-events: none; }
    .swal2-container.se-toast-near .swal2-popup.swal2-toast { pointer-events: auto; }
    .swal2-popup.swal2-toast { justify-content: center; }
    .swal2-popup.swal2-toast .swal2-title { text-align: center; margin: 0; }


    /* ==================================================
       OVERNIGHT PARKING + E-VISITOR PASS
    ================================================== */

      margin-top: 9px;
      padding: 10px;

    .parking-pass-link,

    .parking-pass-link.parking-pass-link-disabled,

    .unit-record-use.unit-record-checkout {

    .swal2-popup.se-checkin-qr-popup {

    .se-checkin-pass-info {

    .se-e-pass-instruction {

      line-height: 1.45;

      margin-top: 3px;

    .se-checkout-notice {

    @media (max-width: 360px) {

      }

      .se-checkin-pass-field b {
        font-size: 11px;
        overflow-wrap: anywhere;
      }
    }

  </style>
</head>
<body>

  <header class="fixed-header">
    <div class="header-inner">
      <div class="brand-row">

          </div>

  <script>
    /* ==================================================
       SECURE ENTRY SYSTEM (Frontend)
       - Crop fix (Drive = Preview)
       - Reuse canvas + downscale (performance)
       - Clean unused functions
       - Code regrouping
    ================================================== */

    /* =========================
       CONFIG / CONSTANTS
    ========================= */
    const WORKER_URL = "https://visitor-sensory.edreborn86.workers.dev";
    const OCR_WORKER_URL = "https://secure-entry-vision01.edreborn86.workers.dev";

    function drawWatermarkOnCanvas(ctx, w, h){
      const text = "SENSORY USE ONLY";
      ctx.save();
      ctx.translate(w * 0.5, h * 0.5);
      ctx.rotate(-40 * Math.PI / 180);
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = "red";
      ctx.font = "bold 14px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // emulate letter spacing (simple)
      const letters = text.split("");
      const spacing = 4; // px
      let totalW = 0;
      const metrics = letters.map(ch => {
        const m = ctx.measureText(ch).width;
        totalW += m;
        return m;
      });
      totalW += spacing * (letters.length - 1);

      let x = -totalW / 2;
      for (let i=0;i<letters.length;i++){
        ctx.fillText(letters[i], x + metrics[i]/2, 0);
        x += metrics[i] + spacing;
      }

      ctx.restore();
    }

    function applyGrayscaleContrast(canvas, ctx) {
      const width = canvas.width;
      const height = canvas.height;
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;

      let minL = 255;
      let maxL = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r   = data[i];
        const g   = data[i + 1];
        const b   = data[i + 2];
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;

        if (lum < minL) minL = lum;
        if (lum > maxL) maxL = lum;

        data[i] = data[i + 1] = data[i + 2] = lum;
      }

      const range = Math.max(1, maxL - minL);

      for (let i = 0; i < data.length; i += 4) {
        let lum       = data[i];
        let stretched = ((lum - minL) * 255) / range;
        stretched     = Math.max(0, Math.min(255, stretched));
        data[i] = data[i + 1] = data[i + 2] = stretched;
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function adaptiveTone(canvas, ctx){
      // Lightweight gamma tweak based on mean brightness
      const w = canvas.width, h = canvas.height;
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;

      let sum = 0;
      const n = w * h;
      for (let i = 0; i < d.length; i += 4) sum += d[i];
      const mean = sum / Math.max(1, n);

      // Choose gamma: brighten if dark, darken if too bright
      let gamma = 1.0;
      if (mean < 105) gamma = 0.85;
      else if (mean > 185) gamma = 1.12;

      if (gamma !== 1.0){
        const inv = 1 / gamma;
        for (let i = 0; i < d.length; i += 4){
          const v = d[i] / 255;
          const nv = Math.pow(v, inv) * 255;
          d[i] = d[i+1] = d[i+2] = nv;
        }
        ctx.putImageData(img, 0, 0);
      }
    }

    function sharpenLight(canvas, ctx){
      // 3x3 sharpen kernel (lightweight) for text clarity
      const w = canvas.width, h = canvas.height;
      if (w * h > 1200 * 900) return; // avoid heavy work on very large frames

      const src = ctx.getImageData(0, 0, w, h);
      const d = src.data;
      const out = new Uint8ClampedArray(d.length);

      // Kernel: [0,-1,0; -1,5,-1; 0,-1,0]
      const idx = (x,y) => (y*w + x) * 4;

      for (let y = 1; y < h-1; y++){
        for (let x = 1; x < w-1; x++){
          const i = idx(x,y);
          // grayscale already, so use R
          const c  = d[i];
          const l  = d[idx(x-1,y)];
          const r  = d[idx(x+1,y)];
          const u  = d[idx(x,y-1)];
          const dn = d[idx(x,y+1)];

          let v = (5*c - l - r - u - dn);
          if (v < 0) v = 0;
          if (v > 255) v = 255;

          out[i] = out[i+1] = out[i+2] = v;
          out[i+3] = d[i+3];
        }
      }

      // Copy borders
      for (let x = 0; x < w; x++){
        let i1 = idx(x,0), i2 = idx(x,h-1);
        out[i1]=d[i1]; out[i1+1]=d[i1+1]; out[i1+2]=d[i1+2]; out[i1+3]=d[i1+3];
        out[i2]=d[i2]; out[i2+1]=d[i2+1]; out[i2+2]=d[i2+2]; out[i2+3]=d[i2+3];
      }
      for (let y = 0; y < h; y++){
        let i1 = idx(0,y), i2 = idx(w-1,y);
        out[i1]=d[i1]; out[i1+1]=d[i1+1]; out[i1+2]=d[i1+2]; out[i1+3]=d[i1+3];
        out[i2]=d[i2]; out[i2+1]=d[i2+1]; out[i2+2]=d[i2+2]; out[i2+3]=d[i2+3];
      }

      src.data.set(out);
      ctx.putImageData(src, 0, 0);
    }

    function isBlurryFromCanvas(canvas, ctx){
      // Variance of Laplacian (sampled) on grayscale image
      const w = canvas.width, h = canvas.height;
      const img = ctx.getImageData(0, 0, w, h).data;

      // sample stride to keep fast
      const step = (w * h > 700000) ? 3 : 2;
      let sum = 0, sum2 = 0, n = 0;

      const get = (x,y) => img[(y*w + x) * 4];

      for (let y = 1; y < h-1; y += step){
        for (let x = 1; x < w-1; x += step){
          const c  = get(x,y);
          const l  = get(x-1,y);
          const r  = get(x+1,y);
          const u  = get(x,y-1);
          const dn = get(x,y+1);
          const lap = 4*c - l - r - u - dn;
          sum += lap;
          sum2 += lap*lap;
          n++;
        }
      }

      const mean = sum / Math.max(1, n);
      const varr = (sum2 / Math.max(1, n)) - (mean*mean);

      // threshold tuned for phone camera + ID text
      const preset = DOC_MODE.presets[DOC_MODE.current] || DOC_MODE.presets.CARD;
      const th = (DOC_MODE.current === 'PASSPORT') ? 220 : 280;
      return varr < th;
    }

    /* =========================
       MYKAD AUTO DASH + VALIDATION
    ========================= */
    (function attachMykadAutoDash(){
      const mykadInput = document.getElementById('mykadPassport');
      if (!mykadInput) return;

      function formatMykadProgressive(digits){
        const d = (digits || '').slice(0, 12);
        if (d.length <= 6) return d;
        if (d.length <= 8) return d.slice(0, 6) + '-' + d.slice(6);
        return d.slice(0, 6) + '-' + d.slice(6, 8) + '-' + d.slice(8);
      }

      function caretFromDigitsCount(formatted, digitsBefore){
        if (!digitsBefore) return 0;
        let count = 0;
        for (let i = 0; i < formatted.length; i++){
          if (/\d/.test(formatted[i])) count++;
          if (count >= digitsBefore) return i + 1;
        }
        return formatted.length;
      }

      function caretFromAllowedCount(str, allowedBefore){
        if (!allowedBefore) return 0;
        return Math.min(allowedBefore, str.length);
      }

      mykadInput.addEventListener('input', function () {
        const raw = (this.value || '').toUpperCase();

        const caretPos = this.selectionStart || 0;

        // Detect passport (has letters) vs MyKad (digits only)
        const alnumBeforeCaret = raw.slice(0, caretPos).replace(/[^A-Z0-9]/g, '');
        const alnum = raw.replace(/[^A-Z0-9]/g, '');
        const hasLetter = /[A-Z]/.test(alnum);

        if (hasLetter){
          // Passport / mixed: keep alphanumeric only (no dashes)
          const newVal = alnum;
          this.value = newVal;
          const newCaret = caretFromAllowedCount(newVal, alnumBeforeCaret.length);
          try { this.setSelectionRange(newCaret, newCaret); } catch(e) {}
          validateMykadPassport();
          return;
        }

        // MyKad (digits): progressive 6-2-4 with caret preservation
        const digitsBeforeCaret = raw.slice(0, caretPos).replace(/\D/g, '').length;
        const digits = raw.replace(/\D/g, '').slice(0, 12);
        const formatted = formatMykadProgressive(digits);

        this.value = formatted;

        const newCaret = caretFromDigitsCount(formatted, Math.min(digitsBeforeCaret, digits.length));
        try { this.setSelectionRange(newCaret, newCaret); } catch(e) {}

        validateMykadPassport();
      });
    })();

    function validateMykadPassport() {
      const el = document.getElementById('mykadPassport');
      if (!el) return true;

      const raw = (el.value || '').toUpperCase().trim();

      if (!raw) {
        el.setCustomValidity('');
        return true;
      }

      const alnum = raw.replace(/[^A-Z0-9]/g, '');
      const hasLetter = /[A-Z]/.test(alnum);

      if (hasLetter) {
        el.setCustomValidity('');
        return true;
      }

      const digits = alnum.replace(/[^0-9]/g, '');

      if (digits.length !== 12) {
        el.setCustomValidity('MyKad must contain 12 digits.');
        return false;
      }

      el.setCustomValidity('');
      return true;
    }

    async function startCamera() {
      video = document.getElementById('camera-video');
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;

        // Best-effort: lock focus/exposure for clearer OCR (device-dependent)
        try {
          const track = stream.getVideoTracks && stream.getVideoTracks()[0];
          if (track && track.getCapabilities) {
            const caps = track.getCapabilities();
            const adv = {};

            if (caps.focusMode && Array.isArray(caps.focusMode)) {
              if (caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
              else if (caps.focusMode.includes('single-shot')) adv.focusMode = 'single-shot';
            }
            if (caps.exposureMode && Array.isArray(caps.exposureMode)) {
              if (caps.exposureMode.includes('continuous')) adv.exposureMode = 'continuous';
            }
            if (caps.whiteBalanceMode && Array.isArray(caps.whiteBalanceMode)) {
              if (caps.whiteBalanceMode.includes('continuous')) adv.whiteBalanceMode = 'continuous';
            }

            // Apply only if we have anything supported
            if (Object.keys(adv).length) {
              await track.applyConstraints({ advanced: [adv] });
            }
          }
        } catch (e) {
          // silent: not supported on all phones
        }

        await video.play().catch(() => {});
        startOcrLive();

      } catch (e) {
        alert("Failed to open camera: " + e.message);
        closeCameraModal();
      }
    }

    function closeCameraModal() {
      document.getElementById('cameraModal').style.display = 'none';

      stopOcrLive();

      if (stream) {
        stream.getTracks().forEach(track => track.stop());

    function setOcrItem(key, ok){
      const el = document.querySelector(`#ocrLivePanel .ocr-item[data-key="${key}"]`);
      if (!el) return;
      el.classList.toggle("good", !!ok);
      el.classList.toggle("bad", !ok);
    }

    function calcStats(gray){
      let sum = 0, sum2 = 0;
      const n = gray.length;
      for (let i=0;i<n;i++){
        const v = gray[i];
        sum += v; sum2 += v*v;
      }
      const mean = sum / n;
      const variance = (sum2 / n) - (mean*mean);
      const std = Math.sqrt(Math.max(0, variance));
      return { mean, std };
    }

    function calcSharpness(gray, w, h){
      let sum = 0, sum2 = 0, n = 0;
      for (let y = 1; y < h-1; y++){
        const row = y*w;
        for (let x = 1; x < w-1; x++){
          const i = row + x;
          const lap = (4*gray[i] - gray[i-1] - gray[i+1] - gray[i-w] - gray[i+w]);
          sum += lap;
          sum2 += lap*lap;
          n++;
        }
      }
      const mean = sum / n;
      const variance = (sum2 / n) - (mean*mean);
      return variance;
    }

    function getGrayFrame(videoEl, canvasEl){
      const ctx = canvasEl.getContext("2d", { willReadFrequently: true });
      const w = canvasEl.width, h = canvasEl.height;
      ctx.drawImage(videoEl, 0, 0, w, h);

      const data = ctx.getImageData(0, 0, w, h).data;
      const gray = new Uint8Array(w*h);

      for (let i=0, p=0; i<data.length; i+=4, p++){
        const r = data[i], g = data[i+1], b = data[i+2];
        gray[p] = (0.2126*r + 0.7152*g + 0.0722*b) | 0;
      }
      return { gray, w, h };
    }

    function pctExtreme(gray, mode){
      let c = 0;
      const n = gray.length;

      const WHITE_T = 220;
      const BLACK_T = 18;

      for (let i=0;i<n;i++){
        const v = gray[i];
        if (mode === "white" && v >= WHITE_T) c++;
        if (mode === "black" && v <= BLACK_T) c++;
      }
      return c / n;
    }

    function hasWhiteCluster(gray, w, h){
      const WHITE_T = 215;
      const MIN_CLUSTER = Math.floor(w * h * 0.008);

      let run = 0;
      for (let i = 0; i < gray.length; i += 2){
        if (gray[i] >= WHITE_T){
          run++;
          if (run >= MIN_CLUSTER) return true;
        } else {
          run = 0;
        }
      }
      return false;
    }

    let lastFrameGray = null;

    function calcStability(gray){
      if (!lastFrameGray){
        lastFrameGray = new Uint8Array(gray.length);
        lastFrameGray.set(gray);
        return false;
      }

      let diff = 0;
      let samples = 0;

      for (let i = 0; i < gray.length; i += 30){
        diff += Math.abs(gray[i] - lastFrameGray[i]);
        samples++;
      }

      lastFrameGray.set(gray);

      const avgDiff = diff / Math.max(1, samples);

      return avgDiff <= OCR_LIVE.TH.stabilityAvgDiff;
    }

    function startOcrLive(){
      const videoEl = document.getElementById("camera-video");
      const canvasEl = document.getElementById("ocrProbe");
      const guidelineEl = document.getElementById("ocrGuideline");
      if (!videoEl || !canvasEl) return;

      OCR_LIVE.running = true;
      OCR_LIVE.lastTick = 0;

      setOcrItem("sharp", false);
      setOcrItem("stable", false);
      setOcrItem("light", false);
      setOcrItem("contrast", false);
      setOcrItem("glare", false);
      setOcrItem("clarity", false);

      lastFrameGray = null;

      if (guidelineEl) guidelineEl.classList.remove("ocr-ready");

      const loop = () => {
        if (!OCR_LIVE.running) return;

        const now = performance.now();
        if (now - OCR_LIVE.lastTick < 90) {
          OCR_LIVE.rafId = requestAnimationFrame(loop);
          return;
        }
        OCR_LIVE.lastTick = now;

        if (videoEl.readyState >= 2 && !videoEl.paused && !videoEl.ended) {
          const { gray, w, h } = getGrayFrame(videoEl, canvasEl);
          const sharp = calcSharpness(gray, w, h);
          const { mean, std } = calcStats(gray);

          const okSharp = sharp >= OCR_LIVE.TH.sharpness;
          const okStable = calcStability(gray);
          const okLight = (mean >= OCR_LIVE.TH.brightnessMin) && (mean <= OCR_LIVE.TH.brightnessMax);
          const okContrast = std >= OCR_LIVE.TH.contrast;

          const glarePct  = pctExtreme(gray, "white");
          const shadowPct = pctExtreme(gray, "black");
          const hasCluster = hasWhiteCluster(gray, w, h);

          const okGlare = (glarePct < OCR_LIVE.TH.glareWhitePct) &&
                          (shadowPct < OCR_LIVE.TH.shadowBlackPct) &&
                          !hasCluster;

          const okClarity = okSharp && okStable && okLight && okContrast && okGlare;

          setOcrItem("sharp", okSharp);
          setOcrItem("stable", okStable);
          setOcrItem("light", okLight);
          setOcrItem("contrast", okContrast);
          setOcrItem("glare", okGlare);
          setOcrItem("clarity", okClarity);

          const allGreen = okSharp && okStable && okLight && okContrast && okGlare && okClarity;
          if (guidelineEl) guidelineEl.classList.toggle("ocr-ready", allGreen);
        }

        OCR_LIVE.rafId = requestAnimationFrame(loop);
      };

      if (OCR_LIVE.rafId) cancelAnimationFrame(OCR_LIVE.rafId);
      OCR_LIVE.rafId = requestAnimationFrame(loop);
    }

    function stopOcrLive(){
      OCR_LIVE.running = false;
      if (OCR_LIVE.rafId) cancelAnimationFrame(OCR_LIVE.rafId);
      OCR_LIVE.rafId = null;

      const guidelineEl = document.getElementById("ocrGuideline");
      if (guidelineEl) guidelineEl.classList.remove("ocr-ready");

      setOcrItem("sharp", false);
      setOcrItem("stable", false);
      setOcrItem("light", false);
      setOcrItem("contrast", false);
      setOcrItem("glare", false);
      setOcrItem("clarity", false);
    }

    /* =========================
       CAPTURE (CROP FIX + DOWNSCALE + REUSE)
    ========================= */
    function getGuidelineCropRatios(){
      const container = document.querySelector('.camera-container');
      const guideline = document.querySelector('.guideline');
      const videoEl   = document.getElementById('camera-video');
      if (!container || !guideline || !videoEl) return null;

      const g = guideline.getBoundingClientRect();

      // IMPORTANT: map guideline relative to *visible video* rectangle (not container)
      let vRect = videoEl.getBoundingClientRect();

      // fallback to container if video rect not ready
      if (!vRect || vRect.width < 2 || vRect.height < 2) {
        vRect = container.getBoundingClientRect();
      }

      const left = clamp01((g.left - vRect.left) / vRect.width);
      const top  = clamp01((g.top  - vRect.top)  / vRect.height);
      const w    = clamp01(g.width  / vRect.width);
      const h    = clamp01(g.height / vRect.height);

      return { left, top, w, h };
    }

    function buildFinalImageFromSourceCrop(drawSourceCropFn, options){
      options = options || {};
      const burnInWatermark = options.burnInWatermark !== false;
      // 1) draw source crop -> __SE_CAPTURE.scaled (already downscaled)
      // 2) crop height to PREVIEW_MAX_RATIO (match preview container)
      // 3) grayscale+contrast on final canvas
      // 4) watermark burn-in
      // 5) return dataUrl

      // drawSourceCropFn MUST:
      // - set __SE_CAPTURE.scaled to desired output size
      // - draw image into __SE_CAPTURE.scaled
      // - return { outW, outH }

      const info = drawSourceCropFn();
      if (!info || !info.outW || !info.outH) return "";

      const outW = info.outW;
      const outH = info.outH;

      // Step B: auto-crop to the target document aspect ratio for better OCR accuracy
      const preset = (DOC_MODE.presets[DOC_MODE.current] || DOC_MODE.presets.CARD);
      const targetAR = preset && preset.ar ? preset.ar : 1.585;
      const desiredH = Math.max(1, Math.round(outW / targetAR));
      const finalH = Math.min(outH, desiredH);
      const srcY = Math.max(0, Math.round((outH - finalH) / 2));

      __SE_CAPTURE.ensureSize(__SE_CAPTURE.final, outW, finalH);

      // draw from scaled to final (center crop to keep document centered)
      __SE_CAPTURE.ctxFinal.clearRect(0, 0, outW, finalH);
      __SE_CAPTURE.ctxFinal.drawImage(__SE_CAPTURE.scaled, 0, srcY, outW, finalH, 0, 0, outW, finalH);

      // Step C: grayscale + adaptive contrast + light sharpening for better OCR accuracy
      applyGrayscaleContrast(__SE_CAPTURE.final, __SE_CAPTURE.ctxFinal);
      adaptiveTone(__SE_CAPTURE.final, __SE_CAPTURE.ctxFinal);
      sharpenLight(__SE_CAPTURE.final, __SE_CAPTURE.ctxFinal);

      // Step D: watermark burn-in (optional)
      if (burnInWatermark) {
        drawWatermarkOnCanvas(__SE_CAPTURE.ctxFinal, outW, finalH);
      }

      // Step E: encode
      const presetQ = (DOC_MODE.presets[DOC_MODE.current] || DOC_MODE.presets.CARD).q || CAPTURE_JPEG_Q;
      return __SE_CAPTURE.final.toDataURL('image/jpeg', presetQ);
    }

    function captureImage() {
      if (!video) return;

      const ratios = getGuidelineCropRatios();
      if (!ratios) return;

      const vw = video.videoWidth || 0;
      const vh = video.videoHeight || 0;
      if (vw < 2 || vh < 2) return;

      const cleanDataUrl = buildFinalImageFromSourceCrop(() => {
        const sx = Math.round(vw * ratios.left);
        const sy = Math.round(vh * ratios.top);
        const sw = Math.round(vw * ratios.w);
        const sh = Math.round(vh * ratios.h);

        const safeSW = Math.max(1, Math.min(sw, vw - sx));
        const safeSH = Math.max(1, Math.min(sh, vh - sy));

        // downscale target (smart per document type)
        const preset = DOC_MODE.presets[DOC_MODE.current] || DOC_MODE.presets.CARD;
        const maxW = preset.maxW || CAPTURE_MAX_W;
        const outW = Math.min(maxW, safeSW);
        const scale = outW / safeSW;
        const outH = Math.max(1, Math.round(safeSH * scale));

        __SE_CAPTURE.ensureSize(__SE_CAPTURE.scaled, outW, outH);
        __SE_CAPTURE.ctxScaled.clearRect(0,0,outW,outH);

        // draw directly from video -> scaled canvas (no full-frame canvas)
        __SE_CAPTURE.ctxScaled.drawImage(video, sx, sy, safeSW, safeSH, 0, 0, outW, outH);

        return { outW, outH };
      }, { burnInWatermark: false });

      if (!cleanDataUrl) return;

      // Blur check: if the image is blurry, require a retake before running OCR.
      try{
        const blurry = isBlurryFromCanvas(__SE_CAPTURE.final, __SE_CAPTURE.ctxFinal);
        if (blurry){
          safeSwalFire({
            icon: 'warning',
            title: 'IMAGE BLUR',
            text: 'PLEASE RETAKE THE ID PHOTO (HOLD STEADY)',
            confirmButtonText: 'RETAKE'
          });
          return;
        }
      } catch(e) {}

      // Create a watermarked version for Drive/submission without affecting OCR.
      const watermarkedDataUrl = (() => {
        const w = __SE_CAPTURE.final.width;
        const h = __SE_CAPTURE.final.height;
        drawWatermarkOnCanvas(__SE_CAPTURE.ctxFinal, w, h);
        const presetQ = (DOC_MODE.presets[DOC_MODE.current] || DOC_MODE.presets.CARD).q || CAPTURE_JPEG_Q;
            return __SE_CAPTURE.final.toDataURL('image/jpeg', presetQ);
      })();

      if (watermarkOverlay) watermarkOverlay.style.display = '';
      setPreviewOnly(cleanDataUrl);
      __SE_SUBMIT_PHOTO = (watermarkedDataUrl && watermarkedDataUrl.startsWith("data:image")) ? watermarkedDataUrl : "";

      closeCameraModal();

      (async () => {
        try {
          document.body.style.cursor = 'progress';

          const res = await fetch(OCR_WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: cleanDataUrl.split(",")[1] })
          });

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          const result = await res.json();
          document.body.style.cursor = 'default';
          
          if (result.manual) {
            throw new Error(result.message || "OCR service is temporarily unavailable. Please enter details manually.");
          }

          if (result.error) {
            throw new Error("AI Message: " + result.message);
          }

          // Continue only if Gemini returned a name or an ID number.
          if (result.name || result.idnum) {
            if (result.name) {
              const rawName = result.name.toUpperCase().trim();
              // Use the existing filterNonNameWords function in this index.html
              const cleanName = filterNonNameWords(rawName);
              document.getElementById('namePassport').value = cleanName;
            }
            
            if (result.idnum) {
              const icEl = document.getElementById('mykadPassport');
              if (icEl) {
                icEl.value = result.idnum.toUpperCase();
                // Trigger the input event so the MyKad auto-format function runs
                icEl.dispatchEvent(new Event('input'));
              }
            }

            // Show a small success toast.
            Swal.fire({
              toast: true,
              position: 'top',
              icon: 'success',
              title: 'AUTOFILL SUCCESSFUL',
              showConfirmButton: false,
              timer: 2000
            });
          } else {
            throw new Error("No usable data was found in the image.");
          }

        } catch (err) {
          document.body.style.cursor = 'default';
          console.error("Autofill Error:", err);
          // Show an error notification if autofill fails.
          Swal.fire({
            icon: 'error',
            title: 'AUTOFILL FAILED',
            text: err.message || 'Please fill in the form manually.',
            confirmButtonText: 'OK'
          });
        }
      })();
    }

    /* =========================
       UNIT FORMAT
       - Preserve cursor position when editing the middle of a unit number
    ========================= */
    function formatUnitNumberValue(inputValue) {
      const current = String(inputValue || '').toUpperCase();
      let raw = current.replace(/[^A-Z0-9]/g, '');

      if (raw.length > 1 && raw[1] !== '-') {
        raw = raw[0] + '-' + raw.slice(1);
      }

      const val = raw.replace(/-/g, '');

      const mG = val.match(/^([A-Z])G(\d{1,2}[A-Z]?)(\d{0,2}[A-Z]?)$/);
      if (mG && val.length > 2) {
        let out = mG[1] + '-G-' + mG[2];
        if (mG[3]) out += '-' + mG[3];
        return out;
      }

      if (val.length > 4 && val[3] === 'A' && val[4] !== '-') {
        return raw.slice(0, 5) + '-' + raw.slice(5);
      }

      const mStd = val.match(/^([A-Z])(\d{2})(\d{1,2}[A-Z]?)$/);
      if (mStd) return mStd[1] + '-' + mStd[2] + '-' + mStd[3];

      const mShort = val.match(/^([A-Z])(\d{2}[A-Z])$/);
      if (mShort) return mShort[1] + '-' + mShort[2];

      const m1 = val.match(/^([A-Z])(\d)$/);
      if (m1) return m1[1] + '-' + m1[2];

      const mAG = val.match(/^([A-Z])G$/);
      if (mAG) return mAG[1] + '-G';

      if (/^[A-Z](-[G]?)?(-?\d{1,2}[A-Z]?)*(-\d{1,2}[A-Z]?)?$/.test(current)) {
        return current;
      }

      return val.replace(/^([A-Z])G/, '$1-G');
    }

    function caretFromUnitTokenCount(formattedValue, tokenCount) {
      if (!tokenCount) return 0;
      let count = 0;
      for (let i = 0; i < formattedValue.length; i++) {
        if (/[A-Z0-9]/.test(formattedValue[i])) count++;
        if (count >= tokenCount) return i + 1;
      }
      return formattedValue.length;
    }

    /* =========================

    const NON_NAME_WORDS = [
      "MALAYSIA", "MALAYSIA P", "KAD PENGENALAN", "IDENTITY CARD", "MYKAD", "ID", "I.D", "PASSPORT",
      "WARGANEGARA", "LELAKI", "PEREMPUAN", "ISLAM", "CHRISTIAN", "BUDDHA", "HINDU",

    ];

    function filterNonNameWords(text) {
      if (!text) return "";

      const joinConnectorLines = (raw) => {
        if (!raw) return raw;
        let lines = String(raw)
          .replace(/\r/g, "")
          .split("\n")
          .map(l => l.trim())
          .filter(Boolean);

        if (lines.length < 2) return raw;

        const isConnectorLineEnd = (s) => /\b(BIN|BINTI|A\/L|A\/P)\s*$/i.test(s);
        const isConnectorLineStart = (s) => /^(BIN|BINTI|A\/L|A\/P)\b/i.test(s);

        const looksNameish = (s) => {
          const u = String(s || "").toUpperCase().trim();
          if (!u) return false;
          if (/\d/.test(u)) return false;
          if (/\b(ALAMAT|ADDRESS|NO\.?|LOT|KG\.?|KAMPUNG|JALAN|PANGSAPURI|PEKAN|LORONG|TAMAN|TMN|BANDAR|SEKSYEN|PERSIARAN|POSKOD|POSTCODE|\d{5})\b/.test(u)) return false;
          return u.length >= 2;
        };

        for (let i = 0; i < lines.length; i++) {
          const cur = lines[i];

          if (isConnectorLineEnd(cur) && i + 1 < lines.length && looksNameish(lines[i + 1])) {
            lines[i] = (cur + " " + lines[i + 1]).replace(/\s+/g, " ").trim();
            lines.splice(i + 1, 1);
            i = Math.max(i - 1, 0);
            continue;
          }

          if (isConnectorLineStart(cur) && i - 1 >= 0 && looksNameish(lines[i - 1])) {
            lines[i - 1] = (lines[i - 1] + " " + cur).replace(/\s+/g, " ").trim();
            lines.splice(i, 1);
            i = Math.max(i - 2, 0);
            continue;
          }
        }

        return lines.join("\n");
      };

      text = joinConnectorLines(text);

      if (!window.__SE_NONNAME_CACHE) {
        const normalizeForFilter = (s) => {
          return (s || "")
            .toString()
            .toUpperCase()
            .replace(/[^A-Z0-9\s\/'\-]/g, " ")
            .replace(/\s+/g, " ")
            .trim();
        };

        const singles = new Set();
        const phrases = [];

        (NON_NAME_WORDS || []).forEach((w) => {
          const nw = normalizeForFilter(w);
          if (!nw) return;

          if (w.includes(" ")) {
            const re = new RegExp("(^|\\s)+" + nw.replace(/\s+/g, "\\s+") + "(?=\\s|$)", "g");
            phrases.push(re);
          } else {
            singles.add(nw);
          }
        });

        phrases.sort((a, b) => (b.source.length - a.source.length));

        window.__SE_NONNAME_CACHE = { normalizeForFilter, singles, phrases };
      }

      const { normalizeForFilter, singles, phrases } = window.__SE_NONNAME_CACHE;

      let t = normalizeForFilter(text);

      const ADDRESS_CUTOFF_REGEX =
        /\b(ALAMAT|ADDRESS|NO\.?|JALAN|PANGSAPURI|PEKAN|LORONG|TAMAN|TMN|KAMPUNG|KG|BANDAR|SEKSYEN|PERSIARAN|APARTMENT|APARTMEN|FLAT|RESIDENSI|HEIGHTS?|HEIGHT)\b/;

      const addrIdx = t.search(ADDRESS_CUTOFF_REGEX);
      if (addrIdx !== -1) {
        t = t.slice(0, addrIdx).trim();
      }

      for (const re of phrases) {
        t = t.replace(re, " ");
      }

      let cleaned = t
        .split(/\s+/)
        .filter(Boolean)
        .filter((w) => !singles.has(w))
        .join(" ")
        .replace(/\s+/g, " ")
        .trim();

      const finalName = cleaned.trim().toUpperCase();
      if (!finalName) return "";

      if ((NON_NAME_WORDS || []).includes(finalName)) return "";

      if (/\d/.test(finalName)) return "";

      const LOCATION_ANYWHERE =
        /\b(KG\.?|KAMPUNG|TAMAN|TMN|BANDAR|JALAN|PANGSAPURI|PEKAN|LORONG|PERSIARAN|SEKSYEN|LOT|POSKOD|POSTCODE|DAERAH|MUKIM|NEGERI|WILAYAH|HEIGHTS?|HEIGHT|APARTMENT|APARTMEN|FLAT|RESIDENSI)\b/;
      if (LOCATION_ANYWHERE.test(finalName)) return "";

      const HAS_CONNECTOR = /\b(BIN|BINTI|A\/L|A\/P)\b/.test(finalName);
      if (HAS_CONNECTOR) return finalName;

      const words = finalName.split(/\s+/).filter(Boolean);
      if (words.length < 2 || words.length > 4) return "";

      if (words.some((w) => w.length < 2)) return "";

      if (!/[AEIOU]/.test(finalName)) return "";

      if (/^(KG\.?|KAMPUNG|TAMAN|TMN|BANDAR|JALAN|PANGSAPURI|PEKAN|LORONG|PERSIARAN|SEKSYEN|LOT|NO)\b/.test(finalName)) return "";

      return finalName;
    }

    function setSearchMode(mode, options) {
      options = options || {};

      const requested = String(mode || 'UNIT').toUpperCase();
      const nextMode = ['UNIT', 'PERSON', 'PASS'].includes(requested) ? requested : 'UNIT';
      window.__SE_SEARCH_MODE = nextMode;

      const unitBtn = document.getElementById('searchModeUnit');

      const inputEl = document.getElementById('searchUniversal');

      if (personBtn) personBtn.classList.toggle('active', nextMode === 'PERSON');
      if (unitBtn) unitBtn.classList.toggle('active', nextMode === 'UNIT');
      if (passBtn) passBtn.classList.toggle('active', nextMode === 'PASS');

      // A checkout selection is valid only while the selected pass search remains active.
      clearSelectedCheckOutRecord();

      // Keep the verified unit only for the automatic UNIT -> PERSON flow.
      // Any normal/manual mode change starts a fresh search context.
      if (options.preserveVerifiedUnit !== true) {
        window.__SE_OWNER_VERIFIED_UNIT = '';
      }

      if (inputEl) {
        inputEl.value = '';
        inputEl.placeholder = nextMode === 'UNIT'
          ? 'UNIT NUMBER'
          : nextMode === 'PASS'
            ? 'VISITOR PASS NUMBER'
            : 'MYKAD / PASSPORT / REG.NUM';
        inputEl.setAttribute('aria-label', inputEl.placeholder);

        if (nextMode === 'PERSON' || nextMode === 'PASS') {
          try { inputEl.focus({ preventScroll: false }); } catch (e) { inputEl.focus(); }
        } else if (document.activeElement === inputEl) {
          inputEl.blur();
        }
      }
    }

    function detectSearchField(raw) {
      const s = (raw || "").trim().toUpperCase();

      const digitsOnly = s.replace(/[^0-9]/g, "");
      const alnumOnly  = s.replace(/[^A-Z0-9]/g, "");

      // Strong ID signals
      if (digitsOnly.length === 12 && !/[A-Z]/.test(alnumOnly)) return FIELD.ID;
      if (/^\d{6}-\d{2}-\d{4}$/.test(s)) return FIELD.ID;
      if (/^[A-Z]{1,3}\d{6,}[A-Z]{3}$/.test(alnumOnly)) return FIELD.ID;
      if (/^[A-Z]{1,3}\d{6,}$/.test(alnumOnly)) return FIELD.ID;

      // Strong REG signals
      if (/^[A-Z]{1,3}\d{4}[A-Z]?$/.test(alnumOnly)) return FIELD.REG;

      // Fallback remains limited to person / vehicle mode.
      return (/[A-Z]/.test(alnumOnly) ? FIELD.REG : FIELD.ID);
    }

    async function searchRecord(field, value) {
      const cacheKey = `SE_SRCH_${field}|${value}`;

      // Micro-cache results (very short TTL) to speed up repeated lookups
      if (!window.__SE_SEARCH_CACHE) window.__SE_SEARCH_CACHE = new Map();
      const cached = window.__SE_SEARCH_CACHE.get(cacheKey);
      if (cached && (Date.now() - cached.t) < 15000) {
        return cached.v;
      }

      if (!window.__SE_SEARCH_INFLIGHT) window.__SE_SEARCH_INFLIGHT = new Map();
      if (window.__SE_SEARCH_INFLIGHT.has(cacheKey)) {
        return await window.__SE_SEARCH_INFLIGHT.get(cacheKey);
      }

      const doFetch = (async () => {
        const url = `${WORKER_URL}?field=${encodeURIComponent(field)}&value=${encodeURIComponent(value)}`;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        try {
          const res = await fetch(url, {
            cache: "no-store",
            keepalive: true,
            signal: controller.signal
          });

          if (!res.ok) {
            const msg = await res.text().catch(() => "");
            throw new Error(`Search failed (${res.status}): ${msg || res.statusText}`);
          }

          const js = await res.json();
          window.__SE_SEARCH_CACHE.set(cacheKey, { t: Date.now(), v: js });
          return js;
        } finally {
          clearTimeout(timeoutId);
        }
      })();

      window.__SE_SEARCH_INFLIGHT.set(cacheKey, doFetch);

      try {
        return await doFetch;
      } finally {
        window.__SE_SEARCH_INFLIGHT.delete(cacheKey);
      }
    }

    function applySearchInputToForm(originalInput, detectedField) {

      if (which === FIELD.ID) {

          idEl.dispatchEvent(new Event('input'));

    function extractSearchRecords(response) {
      if (!response) return [];

      const candidates = [
        response.records,
        response.results,
        response.data && response.data.records,
        Array.isArray(response.data) ? response.data : null
      ];

      for (const item of candidates) {
        if (Array.isArray(item)) return item.filter(x => x && typeof x === 'object');
      }

      const direct = response.record || (response.data && response.data.record);
      if (direct && typeof direct === 'object' && !Array.isArray(direct)) {
        return [direct];

      if (response.exist && response.data && typeof response.data === 'object' && !Array.isArray(response.data)) {

      return [];

    /* =========================
       OVERNIGHT PARKING UI
       - Server snapshot is the source of truth.
       - Frontend only animates the display between server responses.
    ========================= */
    function parkingNumber(value, fallback) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : (fallback || 0);
    }

    function formatParkingDuration(totalSeconds) {
      const value = Math.max(0, Math.floor(parkingNumber(totalSeconds, 0)));
      const hours = Math.floor(value / 3600);
      const minutes = Math.floor((value % 3600) / 60);
      const seconds = value % 60;
      return String(hours).padStart(2, '0') + ':' +
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0');
    }

    function formatParkingMoney(cents) {
      return 'RM' + (Math.max(0, parkingNumber(cents, 0)) / 100).toFixed(2);
    }

    function getParkingSnapshot(source) {
      if (!source || typeof source !== 'object') return null;

      const nested = source.parking && typeof source.parking === 'object'
        ? source.parking
        : null;
      const p = nested || source;

      const sessionId = String(
        p.sessionId || source.parkingSessionId || source.parking_session_id || ''
      ).trim();

      const hasParkingData = !!sessionId ||
        p.durationSeconds != null ||
        source.parkingDurationSeconds != null ||
        p.status ||
        source.parkingSessionStatus;

      if (!hasParkingData) return null;

      const status = String(
        p.status || source.parkingSessionStatus || source.parking_session_status || ''
      ).trim().toUpperCase() || 'ENDED';

      return {
        sessionId,
        status,
        statusLabel: String(p.statusLabel || '').trim(),
        durationSeconds: Math.max(0, Math.floor(parkingNumber(
          p.durationSeconds != null ? p.durationSeconds : source.parkingDurationSeconds,
          0
        ))),
        freeSeconds: Math.max(1, Math.floor(parkingNumber(p.freeSeconds, 86400))),
        blockSeconds: Math.max(1, Math.floor(parkingNumber(p.blockSeconds, 86400))),
        blockFeeCents: Math.max(0, Math.floor(parkingNumber(p.blockFeeCents, 1000))),
        currentChargeCents: Math.max(0, Math.floor(parkingNumber(
          p.currentChargeCents != null ? p.currentChargeCents : source.currentChargeCents,
          0
        ))),
        resetRemainingSeconds: Math.max(0, Math.floor(parkingNumber(
          p.resetRemainingSeconds,
          0
        ))),
        ePassUrl: String(
          p.ePassUrl || source.ePassUrl || source.e_pass_url || ''
        ).trim()
      };
    }

    function getParkingNotice(source) {
      if (!source || typeof source !== 'object') return null;
      const raw = source.parkingNotice && typeof source.parkingNotice === 'object'
        ? source.parkingNotice
        : null;
      if (!raw || raw.required !== true) return null;

      return {
        required: true,
        noticeNumber: String(raw.noticeNumber || '').trim(),
        status: String(raw.status || 'PENDING').trim().toUpperCase(),
        statusLabel: String(raw.statusLabel || 'PENDING SUBMISSION').trim().toUpperCase(),
        totalChargeCents: Math.max(0, Math.floor(parkingNumber(raw.totalChargeCents, 0))),
        totalCharge: String(raw.totalCharge || formatParkingMoney(raw.totalChargeCents)).trim(),
      };
    }

    function computeLiveParking(snapshot, elapsedSeconds) {
      const snap = snapshot || {};
      const elapsed = Math.max(0, Math.floor(parkingNumber(elapsedSeconds, 0)));
      let status = String(snap.status || 'ENDED').toUpperCase();
      let durationSeconds = Math.max(0, Math.floor(parkingNumber(snap.durationSeconds, 0)));

      if (status === 'ACTIVE') durationSeconds += elapsed;

      const freeSeconds = Math.max(1, Math.floor(parkingNumber(snap.freeSeconds, 86400)));
      const blockSeconds = Math.max(1, Math.floor(parkingNumber(snap.blockSeconds, 86400)));
      const blockFeeCents = Math.max(0, Math.floor(parkingNumber(snap.blockFeeCents, 1000)));
      const chargeBlocks = durationSeconds <= freeSeconds
        ? 0
        : Math.ceil((durationSeconds - freeSeconds) / blockSeconds);
      const currentChargeCents = chargeBlocks * blockFeeCents;

      let secondaryLabel = 'FREE TIME REMAINING';
      let secondarySeconds = Math.max(0, freeSeconds - durationSeconds);

      if (status === 'PAUSED') {
        secondaryLabel = 'SESSION RESET IN';
        secondarySeconds = Math.max(0, Math.floor(parkingNumber(snap.resetRemainingSeconds, 0)) - elapsed);
        if (secondarySeconds <= 0 && parkingNumber(snap.resetRemainingSeconds, 0) > 0) {
          status = 'ENDED';
          secondaryLabel = 'SESSION STATUS';
        }
      } else if (status === 'ACTIVE' && currentChargeCents > 0) {
        let nextThreshold = freeSeconds + Math.max(1, chargeBlocks) * blockSeconds;
        if (nextThreshold <= durationSeconds) nextThreshold += blockSeconds;
        secondaryLabel = 'NEXT CHARGE IN';
        secondarySeconds = Math.max(0, nextThreshold - durationSeconds);
      } else if (status === 'ENDED') {
        secondaryLabel = 'SESSION STATUS';
        secondarySeconds = 0;
      } else if (status === 'REVOKED') {
        secondaryLabel = 'PASS STATUS';
        secondarySeconds = 0;
      }

      const statusLabel = status === 'ACTIVE'
        ? 'CHECKED IN'
        : status === 'PAUSED'
          ? 'CHECKED OUT'
          : status === 'REVOKED'
            ? 'DEACTIVATED'
            : 'EXPIRED';

      const secondaryValue = status === 'ENDED'
        ? 'ENDED'
        : status === 'REVOKED'
          ? 'DEACTIVATED'
          : formatParkingDuration(secondarySeconds);

      return {
        status,
        statusLabel,
        durationSeconds,
        duration: formatParkingDuration(durationSeconds),
        secondaryLabel,
        secondaryValue,
        currentChargeCents,
        currentCharge: formatParkingMoney(currentChargeCents)
      };
    }

    function parkingSummaryHtml(snapshot, key, options) {
      if (!snapshot) return '';
      options = options || {};

      const live = computeLiveParking(snapshot, 0);
      const badgeClass = live.status === 'ACTIVE'
        ? 'active'
        : live.status === 'PAUSED'
          ? 'paused'
          : live.status === 'REVOKED'
            ? 'revoked'
            : 'ended';
      const showQrButton = options.showQr && snapshot.ePassUrl
        ? `<button class="parking-show-qr" type="button" data-show-qr-index="${Number(options.recordIndex)}">SHOW QR</button>`
        : '';
      const disableEndedPassLink = options.disableEndedPassLink === true &&
        String(live.status || '').toUpperCase() === 'ENDED';
      const ePassLink = snapshot.ePassUrl && options.showPassLink !== false
        ? disableEndedPassLink
          ? `<button class="parking-pass-link parking-pass-link-disabled" type="button" disabled aria-disabled="true">E-VISITOR PASS EXPIRED</button>`
          : `<a class="parking-pass-link" href="${escapeHtml(snapshot.ePassUrl)}" target="_blank" rel="noopener noreferrer">VIEW LIVE E-VISITOR PASS</a>`
        : '';

      return `
        <div class="parking-summary" data-parking-key="${escapeHtml(key)}">
          <div class="parking-summary-head">
            <span class="parking-summary-title">OVERNIGHT PARKING</span>
            <span class="parking-status-badge js-parking-status ${badgeClass}">${escapeHtml(live.statusLabel)}</span>
          </div>
          <div class="parking-summary-grid">
            <div class="parking-summary-cell duration">
              <span class="parking-summary-label">PARKING DURATION</span>
              <b class="parking-summary-value js-parking-duration">${escapeHtml(live.duration)}</b>
            </div>
            <div class="parking-summary-cell">
              <span class="parking-summary-label js-parking-secondary-label">${escapeHtml(live.secondaryLabel)}</span>
              <b class="parking-summary-value js-parking-secondary">${escapeHtml(live.secondaryValue)}</b>
            </div>
            <div class="parking-summary-cell">
              <span class="parking-summary-label">CURRENT CHARGE</span>
              <b class="parking-summary-value js-parking-charge">${escapeHtml(live.currentCharge)}</b>
            </div>
          </div>
          ${showQrButton}
          ${ePassLink}
        </div>`;
    }

    function updateParkingSummary(root, item, elapsedSeconds) {
      if (!root || !item || !item.snapshot) return;
      const element = root.querySelector(`[data-parking-key="${item.key}"]`);
      if (!element) return;

      const live = computeLiveParking(item.snapshot, elapsedSeconds);
      const durationEl = element.querySelector('.js-parking-duration');
      const labelEl = element.querySelector('.js-parking-secondary-label');
      const secondaryEl = element.querySelector('.js-parking-secondary');
      const chargeEl = element.querySelector('.js-parking-charge');
      const statusEl = element.querySelector('.js-parking-status');

      if (durationEl) durationEl.textContent = live.duration;
      if (labelEl) labelEl.textContent = live.secondaryLabel;
      if (secondaryEl) secondaryEl.textContent = live.secondaryValue;
      if (chargeEl) chargeEl.textContent = live.currentCharge;
      if (statusEl) {
        statusEl.textContent = live.statusLabel;
        statusEl.classList.remove('active', 'paused', 'ended', 'revoked');
        statusEl.classList.add(
          live.status === 'ACTIVE'
            ? 'active'
            : live.status === 'PAUSED'
              ? 'paused'
              : live.status === 'REVOKED'
                ? 'revoked'
                : 'ended'
        );
      }
    }

    function startParkingLiveUpdates(root, items) {
      const list = Array.isArray(items) ? items.filter(x => x && x.snapshot) : [];
      if (!root || !list.length) return function() {};

      const base = (window.performance && typeof performance.now === 'function')
        ? performance.now()
        : Date.now();
      let timerId = null;

      const tick = function() {
        const now = (window.performance && typeof performance.now === 'function')
          ? performance.now()
          : Date.now();
        const elapsed = Math.max(0, Math.floor((now - base) / 1000));
        list.forEach(item => updateParkingSummary(root, item, elapsed));
      };

      tick();
      timerId = setInterval(tick, 1000);
      return function() {
        if (timerId) clearInterval(timerId);
        timerId = null;
      };
    }

    function renderEPassQr(target, ePassUrl) {
      if (!target || !ePassUrl) return false;
      try {
        if (!window.SEQRCode || typeof window.SEQRCode.render !== 'function') {
          throw new Error('Local QR renderer is unavailable.');
        }
        window.SEQRCode.render(target, ePassUrl, {
          size: 196,
          level: 'M',
          quietZone: 4,
          dark: '#111111',
          light: '#ffffff',
          ariaLabel: 'Sensory E-Visitor Pass QR Code'
        });
        return true;
      } catch (error) {
        console.error('QR render error:', error);
        target.innerHTML = '<div style="padding:18px;font-size:10px;color:#a33;line-height:1.45;">QR CODE COULD NOT BE DISPLAYED.<br>USE THE OPEN E-VISITOR PASS BUTTON BELOW.</div>';
        return false;
      }
    }
