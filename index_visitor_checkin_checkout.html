    function getOrCreateDeviceId() {
      try {
        const k = 'SE_DEVICE_ID';
        let v = localStorage.getItem(k);
        if (!v) {
          v = (crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : (Date.now().toString(36) + Math.random().toString(36).slice(2));
          localStorage.setItem(k, v);
        }
        return v;
      } catch (e) {
        return '';
      }
    }

    function normalizeVisitorPass(value) {
      return String(value || '')
        .toUpperCase()
        .replace(/[^A-Z0-9-]/g, '')
        .slice(0, 20);
    }

    function getCheckOutRecord(response) {
      if (!response || typeof response !== 'object') return null;

      const direct = [
        response.record,
        response.data && response.data.record,
        response.data &&
          !Array.isArray(response.data) &&
          !response.data.record &&
          !Array.isArray(response.data.records)
            ? response.data
            : null
      ];

      const arrays = [
        response.records,
        response.results,
        response.data && response.data.records,
        Array.isArray(response.data) ? response.data : null
      ];

      const records = [];
      direct.forEach(item => {
        if (item && typeof item === 'object' && !Array.isArray(item)) records.push(item);
      });
      arrays.forEach(items => {
        if (Array.isArray(items)) items.forEach(item => {
          if (item && typeof item === 'object') records.push(item);
        });
      });

      if (!records.length) return null;

      const active = records.find(record => {
        const status = String(
          record.status ||
          record.visitStatus ||
          record.visit_status ||
          record.checkStatus ||
          ''
        ).toUpperCase().replace(/[^A-Z]/g, '');
        return status !== 'CHECKEDOUT' && status !== 'CHECKOUT';
      });

      return active || records[0];
    }

    function getCheckOutRecordId(record) {
      return record && (
        record.recordId ||
        record.record_id ||
        record.entryId ||
        record.entry_id ||
        record.id ||
        record.rowId ||
        record.row_id ||
        ''
      );
    }

    function getCheckOutStatus(record) {
      return String(
        record && (
          record.status ||
          record.visitStatus ||
          record.visit_status ||
          record.checkStatus ||
          ''
        ) || ''
      ).toUpperCase().replace(/[^A-Z]/g, '');
    }

    async function lookupActiveVisitorByPass(visitorPassNumber) {
      const passNorm = normalize(visitorPassNumber).replace(/[^A-Z0-9]/g, '');
      const url = `${WORKER_URL}?action=CHECKOUT_LOOKUP&field=VISITORPASS&value=${encodeURIComponent(passNorm)}&status=CHECKED_IN`;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      try {
        const res = await fetch(url, {
          cache: 'no-store',
          keepalive: true,
          signal: controller.signal
        });

        if (!res.ok) {
          const msg = await res.text().catch(() => '');
          throw new Error(`Check-out search failed (${res.status}): ${msg || res.statusText}`);
        }

        const response = await res.json();
        return { response, record: getCheckOutRecord(response) };
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function sendCheckOut(record, visitorPassNumber) {
      const data = {
        action: 'CHECK_OUT',
        clientTxnId: (crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : (Date.now().toString(36) + Math.random().toString(36).slice(2)),
        deviceId: getOrCreateDeviceId(),
        recordId: getCheckOutRecordId(record),
        visitorPassNumber: normalizeVisitorPass(visitorPassNumber)
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          cache: 'no-store',
          keepalive: true,
          signal: controller.signal
        });

        if (!res.ok) {
          const msg = await res.text().catch(() => '');
          throw new Error(`Check-out failed (${res.status}): ${msg || res.statusText}`);
        }

        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if (ct.includes('application/json')) return await res.json();

        const raw = await res.text().catch(() => '');
        try { return JSON.parse(raw); } catch (e) { return { success: false, message: raw }; }
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function checkoutRecordHtml(record, visitorPassNumber) {
      const name = record.namePassport || record.name || '-';
      const reg = record.regnum || record.registrationNumber || '-';
      const unit = record.unitNumber || record.unit_number || record.unit || '-';
      const checkIn = record.checkInTime || record.check_in_time || record.timestamp || record.createdAt || record.created_at || '-';

      return `
        <div style="text-align:left;line-height:1.55;font-size:12px;">
          <div><b>NAME:</b> ${escapeHtml(name)}</div>
          <div><b>REG.NUM:</b> ${escapeHtml(reg)}</div>
          <div><b>VISITOR PASS:</b> ${escapeHtml(visitorPassNumber)}</div>
          <div><b>UNIT NUMBER:</b> ${escapeHtml(unit)}</div>
          <div><b>CHECK IN:</b> ${escapeHtml(checkIn)}</div>
        </div>`;
    }

    async function requestCheckOutPass() {
      if (window.Swal && typeof Swal.fire === 'function') {
        const result = await Swal.fire({
          title: 'CHECK OUT',
          text: 'Enter the returned Visitor Pass Number.',
          input: 'text',
          inputPlaceholder: 'VISITOR PASS NUMBER',
          inputAttributes: {
            maxlength: '20',
            autocapitalize: 'characters',
            autocomplete: 'off'
          },
          showCancelButton: true,
          confirmButtonText: 'SEARCH',
          cancelButtonText: 'CANCEL',
          customClass: { confirmButton: 'checkout-confirm-btn' },
          inputValidator: (value) => {
            if (!normalizeVisitorPass(value)) return 'Visitor Pass Number is required.';
            return undefined;
          },
          didOpen: () => {
            const input = Swal.getInput();
            if (!input) return;
            input.addEventListener('input', function() {
              const caret = this.selectionStart == null ? this.value.length : this.selectionStart;
              const before = this.value;
              this.value = normalizeVisitorPass(before);
              const nextCaret = Math.min(caret, this.value.length);
              try { this.setSelectionRange(nextCaret, nextCaret); } catch (e) {}
            });
          }
        });
        return result.isConfirmed ? normalizeVisitorPass(result.value) : '';
      }

      return normalizeVisitorPass(prompt('Enter Visitor Pass Number:') || '');
    }

    async function handleCheckOut() {
      if (__SE_isSubmitting || window.__SE_isCheckingOut) return;

      const visitorPassNumber = await requestCheckOutPass();
      if (!visitorPassNumber) return;

      setCheckOutBtnLoading(true);

      try {
        const { response, record } = await lookupActiveVisitorByPass(visitorPassNumber);

        if (!record || response.exist === false) {
          await safeSwalFire({
            title: 'ACTIVE RECORD NOT FOUND',
            text: 'No checked-in visitor was found for this Visitor Pass Number.',
            icon: 'warning',
            confirmButtonText: 'OK'
          });
          return;
        }

        const status = getCheckOutStatus(record);
        if (status === 'CHECKEDOUT' || status === 'CHECKOUT') {
          await safeSwalFire({
            title: 'ALREADY CHECKED OUT',
            text: 'This visitor record has already been checked out.',
            icon: 'warning',
            confirmButtonText: 'OK'
          });
          return;
        }

        let confirmed = true;
        if (window.Swal && typeof Swal.fire === 'function') {
          const confirmResult = await Swal.fire({
            title: 'CONFIRM CHECK OUT?',
            html: checkoutRecordHtml(record, visitorPassNumber),
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'CONFIRM CHECK OUT',
            cancelButtonText: 'CANCEL',
            customClass: { confirmButton: 'checkout-confirm-btn' },
            background: 'linear-gradient(135deg, #fff5f5 0%, #ffffff 50%, #ffdada 100%)',
            color: '#7f1d1d',
            width: 320
          });
          confirmed = !!confirmResult.isConfirmed;
        } else {
          confirmed = confirm(`Confirm check out for ${record.namePassport || record.name || visitorPassNumber}?`);
        }

        if (!confirmed) return;

        const result = await sendCheckOut(record, visitorPassNumber);
        if (!result || !result.success) {
          throw new Error((result && result.message) || 'Check-out update was not completed.');
        }

        await safeSwalFire({
          title: 'CHECK OUT SUCCESS!',
          text: 'Visitor checked out successfully.',
          icon: 'success',
          confirmButtonText: 'OK',
          background: 'linear-gradient(135deg, #fff5f5 0%, #ffffff 50%, #ffdada 100%)',
          color: '#7f1d1d',
          width: 300,
          timer: 5000,
          timerProgressBar: true
        });
      } catch (err) {
        const isAbort = err && (err.name === 'AbortError' || /aborted|signal/i.test(err.message || ''));
        await safeSwalFire({
          title: 'CHECK OUT ERROR',
          text: isAbort
            ? 'Connection timed out or was interrupted. Please try again.'
            : (err.message || 'Please try again.'),
          icon: 'error',
          confirmButtonText: 'OK'
        });
      } finally {
        setCheckOutBtnLoading(false);
      }
    }

    /* =========================
       SUBMIT
    ========================= */
    let __SE_isSubmitting = false;
    window.__SE_isCheckingOut = false;
    let __seActiveToastEl = null;

    function __seIsVisible(el){
      if (!el) return false;
      if (el.disabled) return false;
      if (!el.getClientRects || el.getClientRects().length === 0) return false;
      const cs = window.getComputedStyle ? getComputedStyle(el) : null;
      if (cs && (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0')) return false;
      return true;
    }

    function __seGetLabelText(el){
      const id = el && el.id ? el.id : '';
      if (id) {
        const lbl = document.querySelector(`label[for="${CSS.escape(id)}"]`);
        if (lbl) return (lbl.textContent || '').trim();
      }
      const ph = (el && el.getAttribute) ? (el.getAttribute('placeholder') || '').trim() : '';
      if (ph) return ph.trim();
      const aria = (el && el.getAttribute) ? (el.getAttribute('aria-label') || '').trim() : '';
      if (aria) return aria.trim();
      const raw = (id || (el && el.name) || '').toString();
      if (raw) {
        return raw
          .replace(/[_-]+/g, ' ')
          .replace(/([a-z])([A-Z])/g, '$1 $2')
          .replace(/\s+/g, ' ')
          .trim()
          .toUpperCase();
      }
      return 'FIELD';
    }

    function __seFirstInvalid(formEl){
      if (!formEl) return null;
      const els = formEl.querySelectorAll('input, select, textarea');
      for (const el of els) {
        if (!__seIsVisible(el)) continue;
        try { if (el.id === 'mykadPassport') validateMykadPassport(); } catch (e) {}
        try { if (el.id === 'contact') updateCallLink(); } catch (e) {}
        if (el.willValidate && el.validity && el.validity.valid === false) return el;
      }
      return null;
    }

    function __seToastGeom(el){
      try {
        const r = el.getBoundingClientRect();
        const viewportW = window.innerWidth || document.documentElement.clientWidth || 360;
        const centerX = r.left + (r.width / 2);
        const maxW = Math.min(viewportW - 16, 560);
        const width = Math.max(260, Math.min(maxW, r.width));
        const half = width / 2;
        const clampedCenterX = Math.max(8 + half, Math.min(viewportW - 8 - half, centerX));
        return { centerX: clampedCenterX, width };
      } catch (e) {
        const vw = (window.innerWidth||360);
        const w = Math.min(vw-16, 360);
        return { centerX: vw/2, width: w };
      }
    }

    function __seShowInvalidToast(el){
      const label = __seGetLabelText(el);
      const msgRaw = (el && el.validationMessage) ? el.validationMessage : '';
      const msg = msgRaw || 'Required';
      const title = `${label}: ${msg}`;

      const formEl = document.getElementById('registrationForm');
      if (formEl) formEl.querySelectorAll('.se-invalid-blink').forEach(x => x.classList.remove('se-invalid-blink'));
      try { el.classList.add('se-invalid-blink'); } catch (e) {}
      try { el.focus({ preventScroll: false }); } catch (e) { try { el.focus(); } catch (e2) {} }
      try { el.scrollIntoView({ behavior: 'auto', block: 'center' }); } catch (e) {}

      if (window.Swal && typeof Swal.fire === 'function') {
        try { Swal.close(); } catch (e) {}
        const g = __seToastGeom(el);
        setTimeout(() => {
          const g = __seToastGeom(el);
          try { Swal.close(); } catch (e) {}
          Swal.fire({
            toast: true,
            position: 'top',
            icon: 'warning',
            title: title,
            showConfirmButton: false,
            didOpen: (toast) => {
              try {
                __seActiveToastEl = el;
                const c = Swal.getContainer();
                try { if (c) c.classList.add('se-toast-near'); } catch (e) {}
                const tr = el.getBoundingClientRect();
                const toastH = (toast && toast.getBoundingClientRect) ? toast.getBoundingClientRect().height : 70;
                const header = document.querySelector('.fixed-header');
                const safeTop = (header ? header.offsetHeight : 0) + 6;
                let top = tr.top - toastH - 10;
                if (top < safeTop) top = tr.bottom + 10;
                const vh = window.innerHeight || document.documentElement.clientHeight || 640;
                if (top > vh - toastH - 6) top = Math.max(safeTop, vh - toastH - 6);

                if (c && g) {
                  c.style.position = 'fixed';
                  c.style.top = top + 'px';
                  c.style.left = g.centerX + 'px';
                  c.style.transform = 'translateX(-50%)';
                  c.style.right = 'auto';
                  c.style.bottom = 'auto';
                  c.style.width = g.width + 'px';
                  c.style.padding = '0';
                  c.style.margin = '0';
                  c.style.pointerEvents = 'none';
                }
                if (toast) {
                  toast.style.width = '100%';
                  toast.style.margin = '0';
                  toast.style.pointerEvents = 'auto';
                }
              } catch (e) {}
              try { toast.addEventListener('click', () => Swal.close()); } catch (e) {}
            }
          });
        }, 60);
      } else {
        alert(title);
      }
    }

    function __seCloseToastOnEdit(target){
      try {
        if (target && target.classList && target.classList.contains('se-invalid-blink')) {
          target.classList.remove('se-invalid-blink');
        }
      } catch (e) {}
      try {
        if (__seActiveToastEl && target === __seActiveToastEl && window.Swal) {
          Swal.close();
          __seActiveToastEl = null;
        }
      } catch (e) {}
    }

    document.addEventListener('input', (ev) => __seCloseToastOnEdit(ev && ev.target), true);
    document.addEventListener('change', (ev) => __seCloseToastOnEdit(ev && ev.target), true);

    function __seEnsureNoValidate(){
      const f = document.getElementById('registrationForm');
      if (!f) return;
      try { f.noValidate = true; } catch (e) {}
      try { f.setAttribute('novalidate','novalidate'); } catch (e) {}
    }
    __seEnsureNoValidate();

    document.getElementById("registrationForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      try { validateMykadPassport(); } catch (e) {}
      try { updateCallLink(); } catch (e) {}

      const firstBad = __seFirstInvalid(this);
      if (firstBad) {
        __seShowInvalidToast(firstBad);
        return;
      }

      if (__SE_isSubmitting) return;
      __SE_isSubmitting = true;

      setSubmitBtnLoading(true);

      const deviceId = getOrCreateDeviceId();

      if (!window.__SE_CLIENT_TXN_ID) {
        window.__SE_CLIENT_TXN_ID = (crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
      }
      const clientTxnId = window.__SE_CLIENT_TXN_ID;

      const croppedImage = getVisibleCroppedImageData();

      const visitorPassNumberVal = document.getElementById('visitorPassNumber').value.trim().toUpperCase();
      const unitNumberVal = document.getElementById('unitNumber').value.trim().toUpperCase();

      const existingPhotoLink = (window.__SE_EXISTING_PHOTO_LINK || '').toString().trim();

      if (!croppedImage && !existingPhotoLink) {
        safeSwalFire({
          title: 'ID PHOTO REQUIRED',
          text: 'Please take an ID photo before submitting.',
          icon: 'warning',
          confirmButtonText: 'OK'
        });
        setSubmitBtnLoading(false);
        __SE_isSubmitting = false;
        return;
      }
      const data = {
        action: 'CHECK_IN',
        clientTxnId,
        deviceId,
        namePassport: document.getElementById('namePassport').value,
        mykadPassport: document.getElementById('mykadPassport').value,
        regnum: document.getElementById('regnum').value,
        contact: document.getElementById('contact').value,
        visitorPassNumber: visitorPassNumberVal,
        unitNumber: unitNumberVal,
        imageUrl: croppedImage || ''
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
          cache: "no-store",
          keepalive: !(data && data.imageUrl),
          signal: controller.signal
        });

        if (!res.ok) {
          const errText = await res.text().catch(() => "");
          throw new Error(`HTTP ${res.status} ${res.statusText}${errText ? " - " + errText.slice(0, 200) : ""}`);
        }

        const ct = (res.headers.get("content-type") || "").toLowerCase();
        let respData;
        if (ct.includes("application/json")) {
          respData = await res.json();
        } else {
          const t = await res.text().catch(() => "");
          try { respData = JSON.parse(t); } catch { respData = { success: false, message: t }; }
        }

        if (respData && respData.success) {
          safeSwalFire({
            title: 'CHECK IN SUCCESS!',
            text: 'Visitor checked in successfully!',
            icon: 'success',
            confirmButtonText: 'OK',
            background: 'linear-gradient(135deg,#e9f5e9,#fff,#d5ffe0)',
            color: '#176B39',
            width: 300,
            customClass: { popup: 'shadow-2xl px-7 pt-7 pb-6' },
            willOpen: (popup) => { popup.style.borderRadius = '14px'; },
            timer: 5000,
            timerProgressBar: true
          });

          document.getElementById("registrationForm").reset();

          (function hideCallBtnAfterReset(){
            const callBtn = document.getElementById('callBtn');
            if (callBtn) {
              callBtn.style.display = 'none';
              callBtn.removeAttribute('href');
            }
            try { updateCallLink(); } catch(e) {}
          })();

          if (previewImg) previewImg.src = "#";
          if (imageContainer) imageContainer.style.display = 'none';
          __SE_SUBMIT_PHOTO = "";
          window.__SE_CLIENT_TXN_ID = null;
          window.__SE_LAST_SEARCH_STATUS = '';
          window.__SE_EXISTING_PHOTO_LINK = '';

          if (watermarkOverlay) watermarkOverlay.style.display = '';

        } else {
          safeSwalFire({
            title: 'ERROR!',
            text: 'Submit failed: ' + (respData.message || ''),
            icon: 'error',
            confirmButtonText: 'OK'
          });
        }
      } catch (err) {
        safeSwalFire({
          title: 'ERROR!',
          text: 'Error submitting data: ' + err.message,
          icon: 'error',
          confirmButtonText: 'OK'
        });
      } finally {
        clearTimeout(timeoutId);
        setSubmitBtnLoading(false);
        __SE_isSubmitting = false;
      }
    });

    /* =========================
       UI - FIXED HEADER OFFSET & DATE TIME
    ========================= */
    function pad(n){return n<10?'0'+n:n;}
    function updateDateTime() {
      const now = new Date();
      const d   = pad(now.getDate());
      const m   = pad(now.getMonth() + 1);
      const y   = now.getFullYear();
      const h   = pad(now.getHours());
      const min = pad(now.getMinutes());
      const s   = pad(now.getSeconds());
      const elDate = document.getElementById("liveDateOnly");
      const elTime = document.getElementById("liveTimeOnly");
      if(elDate) elDate.textContent = `${d}/${m}/${y}`;
      if(elTime) elTime.textContent = `${h}:${min}:${s}`;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    function syncHeaderOffset() {
      const header = document.querySelector('.fixed-header');
      if (!header) return;
      const height = header.offsetHeight;
      document.body.style.paddingTop = height + 'px';
    }
    window.addEventListener('load', syncHeaderOffset);
    window.addEventListener('resize', syncHeaderOffset);
    syncHeaderOffset();
  </script>
</body>
